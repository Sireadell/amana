<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amana</title>
<meta name="description" content="Amana lets a buyer promise payment by pledging yield savings they already hold, while the seller can claim only what is owed if the buyer misses the date. Live on Arc mainnet.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#050b09;--surface:#0a1512;--surface2:#08110e;--ink:#f3f7f5;--mute:#8b9b94;--line:#15271f;--line2:#1f372d;
  --accent:#2fe5a6;--accent-hover:#5af0bc;--accent-ink:#03130c;--tint:#0d2a20;--accent-glow:rgba(47,229,166,.28);
  --warn:#f2a54a;--warn-tint:#2a1c08;--warn-line:#5a3b11;--bad:#ff8f8f;--bad-tint:#2b1313;--bad-line:#5a2626;--ok-line:#1b4d3a;
  --blue:#6aa8ff;--blue-tint:#0f1f3a;--blue-line:#23407a;
  --bar:rgba(5,11,9,.88);--skel1:#0d1a15;--skel2:#16281f;
  --shadow:0 0 0 1px rgba(255,255,255,.012),0 14px 34px -10px rgba(0,0,0,.6);--shadow-lg:0 24px 70px -10px rgba(0,0,0,.8);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.fig,.big,.stats b,.clock{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11"}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell: phone first. bottom bar on phones, side menu from 800px */
.shell{min-height:100vh;min-height:100dvh}
.content{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;min-width:0}
.sidenav{display:none}
.top{position:sticky;top:0;z-index:20;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:19px;color:var(--ink);text-decoration:none}
.brand svg{width:28px;height:28px;flex:none}
.brand .beta{font-size:11px;font-weight:600;letter-spacing:0;color:var(--mute);border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:2px 9px;margin-left:6px}
.actions{display:flex;gap:10px;align-items:center}
.hbtn{display:inline-flex;align-items:center;gap:9px;min-height:42px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;transition:border-color .15s,transform .1s}
#wmenu{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#wmenu button{background:none;border:0;color:inherit;font:inherit;font-size:14px;font-weight:600;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
#wmenu button:hover{background:var(--ok-line)}
.hbtn:hover{border-color:var(--ok-line)}
.hbtn:active{transform:scale(.98)}
.hbtn .dot{width:20px;height:20px;border-radius:50%;background:#1b66ff;display:grid;place-items:center;flex:none}
.hbtn .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.hbtn::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--mute);border-bottom:1.6px solid var(--mute);transform:rotate(45deg) translateY(-2px);flex:none}
#ngnBtn::after{display:none}
#net{cursor:default}
#wallet::before{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7bf5cf,#16a577 70%);flex:none}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{margin:0;padding:0 16px 84px;text-align:center;font-size:13px}
.foot a{color:var(--mute)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-top:1px solid var(--line)}
.bottom a{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--mute);text-decoration:none;position:relative}
.bottom a svg.i{width:20px;height:20px}
.bottom a.on{color:var(--accent);font-weight:600}
.bottom a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 3px 3px;background:var(--accent)}

/* show only on phone or only on desktop */
@media (max-width:799px){.dk{display:none!important}}
@media (min-width:800px){.ph{display:none!important}}

/* shared pieces */
.phh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.phh b{font-size:17px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.t{font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0}
.t2{font-weight:700;font-size:18px;line-height:1.25;letter-spacing:-.015em;margin:0 0 6px}
.s{color:var(--mute);font-size:14px}
p{margin:0}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px}
.card.k{background:var(--surface2);box-shadow:none}
.card p+p{margin-top:8px}
.big{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.big .s{font-size:16px;font-weight:600;letter-spacing:0}
.chip{display:inline-flex;align-items:center;background:var(--tint);color:var(--accent);border:1px solid var(--ok-line);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;vertical-align:middle;line-height:1.5}
.chip.w{background:var(--warn-tint);color:var(--warn);border-color:var(--warn-line)}
.chip.b{background:var(--blue-tint);color:var(--blue);border-color:var(--blue-line)}
.chip.m{background:var(--surface2);color:var(--mute);border-color:var(--line2)}
.chip.bad{background:var(--bad-tint);color:var(--bad);border-color:var(--bad-line)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;padding:0 22px;border:1px solid var(--accent);border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;text-align:center;text-decoration:none;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.o:hover{border-color:var(--accent);background:transparent}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mute);cursor:not-allowed;font-size:14px;line-height:1.3;padding:8px 16px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);margin:0 0 8px;font-size:14.5px;cursor:text}
.f:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.f>span{color:var(--mute);font-weight:500;flex:none}
input{border:0;outline:0;background:transparent;min-width:0}
.f input{flex:1;text-align:right;font-size:15px;min-height:46px;padding:0}
input::placeholder{color:var(--mute);opacity:.7}
.plain{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface)}
.plain:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
select{min-height:36px;font-size:13px;font-weight:600;padding:0 26px 0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface2);cursor:pointer}
.msg{padding:12px 14px;border-radius:12px;font-size:14.5px;background:var(--tint);border:1px solid var(--ok-line)}
.msg:empty{display:none}
.msg.err{color:var(--bad);background:var(--bad-tint);border-color:var(--bad-line)}
.hint{color:var(--mute);font-size:13.5px;line-height:1.45;margin-top:8px}
.err{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr;gap:12px}
.colA,.colB{display:flex;flex-direction:column;gap:12px;min-width:0}

/* home, drawn from the dark mockup */
.home{display:flex;flex-direction:column;gap:16px}
.hero{display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
.hero-art{display:none}
h1.home-t{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0}
h1.home-t em{font-style:normal;color:var(--accent)}
.hero .lead{margin:14px 0 22px;color:var(--mute);font-size:15px;line-height:1.5;max-width:340px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;transition:border-color .15s,background .15s,transform .1s}
.choice:active{transform:scale(.99)}
.choice.g{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.g:hover{background:var(--accent-hover)}
.choice.o:hover{border-color:var(--accent)}
.choice svg.i{width:17px;height:17px;stroke-width:2}
.how{padding:20px 22px 18px;background:var(--surface)}
.how h2{font-size:17px;font-weight:700;margin:0 0 20px;letter-spacing:-.01em}
.steps{display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.steps::before{content:"";position:absolute;top:15px;left:16.6%;right:16.6%;height:2px;background:var(--line2)}
.steps::after{content:"";position:absolute;top:15px;left:16.6%;width:33.3%;height:2px;background:var(--accent)}
.step{position:relative;z-index:1;text-align:center;padding:0 4px}
.step i{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;font-style:normal;font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line2);color:var(--ink)}
.step.d i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step b{display:block;font-size:14px;font-weight:700}
.step small{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.how .more{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13.5px;font-weight:500;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px}
.how .more svg.i{width:14px;height:14px;stroke-width:2}
.feats{display:grid;grid-template-columns:1fr;gap:12px}
.feat{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);border:1px solid var(--ok-line);color:var(--accent);display:grid;place-items:center;flex:none}
.feat .ic svg.i{width:22px;height:22px}
.feat b{display:block;font-size:15px;font-weight:700;margin-bottom:3px;letter-spacing:-.005em}
.feat span{display:block;font-size:13px;line-height:1.45;color:var(--mute)}
.lower{display:grid;grid-template-columns:1fr;gap:16px}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 18px 18px;min-width:0}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.panel h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.005em}
.panel header a{font-size:13px;font-weight:500;color:var(--accent);text-decoration:none}
.act{display:grid;grid-template-columns:30px 1.15fr 1fr auto;gap:14px;align-items:center;padding:7px 0;color:var(--ink);text-decoration:none;min-width:0}
.act .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--tint);color:var(--accent);border:1px solid var(--ok-line)}
.act .ai.b{background:var(--blue-tint);color:var(--blue);border-color:var(--blue-line)}
.act .ai.w{background:var(--bad-tint);color:#ff8a7a;border-color:var(--bad-line)}
.act .ai svg.i{width:16px;height:16px}
.act b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.act small{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:1px}
.act .chip{justify-self:end}
.act>div{min-width:0}
.act>div b,.act>div small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:14px;color:var(--mute);padding:8px 0}
.faq{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.faq details{border:1px solid var(--line2);border-radius:12px;background:var(--surface2);padding:0 16px}
.faq summary{min-height:44px;font-size:13.5px;font-weight:500;gap:12px}
.faq details p{font-size:13.5px;color:var(--mute);padding:0 0 14px;line-height:1.5}

/* new request */
.amtbox .s{display:block}
.amtrow{display:flex;align-items:center;gap:10px}
.amtrow input{flex:1;font-size:40px;font-weight:700;letter-spacing:-.04em;min-height:56px;padding:0;width:100%}
.amtbox .money{margin:2px 0 14px;min-height:20px;font-size:14px;color:var(--mute)}
.amtbox .money:empty{display:none}
.unit{font-size:16px;font-weight:600;color:var(--mute)}
@media (max-width:799px){
  #newForm[data-step="1"] .p2,#newForm[data-step="1"] .s2{display:none}
  #newForm[data-step="2"] .p1,#newForm[data-step="2"] .s1{display:none}
}
.tiles{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);cursor:pointer;font-size:14.5px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 1px var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){opacity:.55;cursor:not-allowed;background:var(--surface2)}
.opt .n{font-weight:600}
.opt .r{text-align:right;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.opt .r b{font-size:14.5px;color:var(--ink);font-weight:600}
.opt .r .ok{color:var(--accent);font-weight:600}
.opt .r .no{color:var(--bad);font-weight:600}
.lab{font-size:13px;font-weight:600;color:var(--ink);margin:6px 0 2px}
.pvcard .big{font-size:34px}

/* request page */
.tl{display:flex;margin:6px 0}
.tl>div{flex:1;font-size:12px;color:var(--mute);text-align:center;position:relative;padding-top:16px}
.tl>div::before{content:"";position:absolute;top:2px;left:0;right:0;height:3px;background:var(--line2)}
.tl>div:not(:first-child)::before{left:3px}
.tl>div:not(:last-child)::before{right:3px}
.tl .d::before{background:var(--accent)}
.tl .d{color:var(--ink);font-weight:600}
.prog{height:6px;border-radius:9px;background:var(--line2);overflow:hidden;margin:12px 0 8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.clockrow{margin-top:6px}
.clockrow b{color:var(--ink);font-variant-numeric:tabular-nums}
.record{font-size:13.5px;color:var(--mute)}
.need{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px}
.linkcard{word-break:break-all;font-size:14px}
details{font-size:14.5px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 16px}
summary{cursor:pointer;font-weight:600;min-height:46px;display:flex;align-items:center;justify-content:space-between;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:7px;height:7px;border-right:1.8px solid var(--mute);border-bottom:1.8px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin-right:4px;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
dl{display:grid;grid-template-columns:1fr;gap:2px 12px;margin:0 0 14px;font-size:14px}
dt{color:var(--mute);font-size:12.5px;font-weight:600;margin-top:10px}
dd{margin:0;word-break:break-all}
@media (max-width:799px){
  .rq[data-sub="review"] .colB,.rq[data-sub="pledge"] .colA{display:none}
}

/* my requests and record */
.tabs{display:flex;gap:6px;font-size:13px}
.tabs button{flex:1;min-height:40px;border-radius:12px;background:var(--surface);color:var(--mute);font-weight:600;cursor:pointer;border:1px solid var(--line2)}
.tabs button.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.rowcard{display:block;color:var(--ink);text-decoration:none}
.rowcard .top2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowcard .top2 .chip{margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td a{font-weight:600;text-decoration:none}
td small{display:block;color:var(--mute);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .card{padding:12px;font-size:12.5px;color:var(--mute);line-height:1.3}
.stats .card b{display:block;font-size:26px;color:var(--ink);letter-spacing:-.03em;margin-bottom:2px}
.lookupbtn{margin-top:2px}
@media (min-width:800px){.lookupbtn{align-self:flex-start}}

/* about */
.about{display:flex;flex-direction:column;gap:12px}
.about h2{font-size:18px;letter-spacing:-.015em;margin:8px 0 0}
.about p,.about li{font-size:15px;margin:0}
.about p+p{margin-top:8px}
.story{border-left:3px solid var(--accent)}
.about ol{list-style:none;counter-reset:s;padding:0;margin:0}
.about ol li{counter-increment:s;position:relative;padding:0 0 12px 38px}
.about ol li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:700;font-size:13px;border:1px solid var(--ok-line)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vlist .opt{cursor:default;min-height:44px}
.vlist .opt:hover{border-color:var(--line2)}
.code{word-break:break-all;font-size:13.5px}

/* loading */
.sk{border-radius:14px;background:linear-gradient(90deg,var(--skel1) 25%,var(--skel2) 50%,var(--skel1) 75%);background-size:300% 100%;animation:shine 1.4s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.toast{position:fixed;left:16px;right:16px;bottom:76px;background:var(--surface);border:1px solid var(--ok-line);color:var(--ink);padding:12px 16px;border-radius:14px;font-size:14.5px;font-weight:600;text-align:center;z-index:60;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:none}
.demo{position:relative;z-index:70;background:var(--warn-tint);color:var(--warn);border-bottom:1px solid var(--warn-line);font-size:12px;font-weight:600;text-align:center;padding:2px 8px}
@media (max-width:600px){.act{grid-template-columns:30px minmax(0,1fr) auto;gap:12px}.act>.chip{display:none}.act>div:nth-of-type(2){text-align:right}}
@media (max-width:480px){#net,.top .beta,#wallet::before{display:none}.hbtn{padding:0 10px;gap:7px;font-size:13px}.top{padding:0 12px}.brand{font-size:18px;gap:8px}}

/* tablet and up: two columns on the hero */
@media (min-width:800px){
  .hero{grid-template-columns:minmax(0,1fr) 340px;gap:24px}
  .feats{grid-template-columns:repeat(3,1fr)}
  .lower{grid-template-columns:1.05fr 1fr}
  h1.home-t{font-size:40px}
  .hero .lead{max-width:380px}
  .choices{flex-direction:row;gap:14px}
  .choice{padding:0 26px}
}
/* wide desktop: sidebar, text, picture and the card in one row */
@media (min-width:1100px){
  .hero{grid-template-columns:410px minmax(260px,1fr) 382px;gap:0;min-height:290px}
  .hero-art{display:block;align-self:stretch;position:relative}
  .hero-art svg{position:absolute;left:50%;top:50%;width:330px;height:auto;transform:translate(-50%,-50%);overflow:visible}
  h1.home-t{font-size:50px;line-height:.98}
  .hero .lead{max-width:335px;font-size:15px;line-height:1.55}
}

/* desktop: side menu replaces the bottom bar, forms get a live preview */
@media (min-width:800px){
  .shell{display:grid;grid-template-columns:clamp(196px,16.8vw,232px) minmax(0,1fr);align-items:start}
  .sidenav{display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;height:100dvh;padding:24px 14px 22px;border-right:1px solid var(--line);background:var(--surface2)}
  .sidenav .brand{padding:0 8px 34px;font-size:19px}
  .sidenav a:not(.brand){display:flex;align-items:center;gap:14px;min-height:45px;padding:0 16px;border-radius:12px;color:var(--mute);text-decoration:none;font-size:15px;font-weight:500;transition:background .15s,color .15s}
  .sidenav a:not(.brand):hover{color:var(--ink)}
  .sidenav a.on{background:var(--tint)!important;color:var(--accent)!important}
  .sidenav .btm{margin-top:auto}
  .sidenav .btm~a{margin-top:0}
  .bottom,.foot{display:none}
  .top{justify-content:flex-end;background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 16px 0 40px;height:72px}
  .top .brand{display:none}
  main{max-width:1180px;margin:0;padding:8px 16px 48px 40px;gap:16px}
  .two{grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
  .home .two{display:grid}
  .colA,.colB{gap:14px}
  .t{font-size:26px}
  .big{font-size:36px}
  .card{padding:20px}
  .how{padding:22px 24px 20px}
  .toast{left:50%;right:auto;width:max-content;max-width:440px;bottom:24px;transform:translate(-50%,8px)}
  .toast.show{transform:translate(-50%,0)}
  .btns{flex-direction:row;flex-wrap:wrap}
  .btn{width:auto;min-height:46px;padding:0 26px}
  .btn:disabled{width:auto}
  .amtbox{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;border:1px solid var(--line2);border-radius:12px;padding:2px 14px 6px;background:var(--surface);margin-bottom:8px}
  .amtbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
  .amtbox>.s{font-size:14.5px;font-weight:500;padding-top:4px}
  .amtrow{justify-content:flex-end}
  .amtrow input{font-size:22px;min-height:44px;text-align:right}
  .amtbox .money{grid-column:1/-1;text-align:right;margin:0}
  .opt .r{font-size:13px}
  #newForm .colB{position:sticky;top:12px}
  .tabs{max-width:320px}
  .stats .card{font-size:13.5px;padding:16px}
  .stats .card b{font-size:28px}
  .about{max-width:760px}
  .share{max-width:520px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

<body>

<div class="shell">
  <aside class="sidenav" aria-label="Sections">
    <a class="brand" href="#/home"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="#0d2a20" stroke="var(--accent)" stroke-width="1.6"/><path d="M8.5 20V13.5a5.5 5.5 0 0 1 11 0V20" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="14.5" r="2.1" fill="var(--accent)"/></svg>Amana<span class="beta">Beta</span></a>
    <a href="#/home" data-nav="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 3.8l8.5 7.2V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Home</a>

    <a href="#/about" data-nav="how" class="btm"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8M12 17h.01"/></svg>How it works</a>
    <a href="#/about" data-nav="about"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6h.01"/></svg>About</a>
  </aside>
  <div class="content">
    <header class="top">
      <a class="brand" href="#/home"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="#0d2a20" stroke="var(--accent)" stroke-width="1.6"/><path d="M8.5 20V13.5a5.5 5.5 0 0 1 11 0V20" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="14.5" r="2.1" fill="var(--accent)"/></svg>Amana<span class="beta">Beta</span></a>
      <span class="actions"><button class="hbtn" id="ngnBtn" type="button" title="Show amounts in naira" hidden>&#8358; on</button><button class="hbtn" id="net" type="button" aria-label="Network: Arc"><span class="dot"></span>Arc</button><button class="hbtn" id="wallet" type="button">Connect wallet</button></span>
    </header>
    <main id="main"></main>
    <p class="foot"><a href="#/about">About Amana</a></p>
  </div>
</div>

  <a href="#/record" data-nav="record"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-3.8 3.4-6 7.5-6s7.5 2.2 7.5 6"/></svg>Record</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script>
const CFG = {
  amana: '0x9AbcF46919C3778FD33F3Bd56ac33dFcb015138a',
  usdc: '0x3600000000000000000000000000000000000000',
  vault: '0x42EAB64310E1D1c66b4d8aF7C9C4ce253885eB83',
  rpc: 'https://rpc.mainnet.arc.io',
  chainId: 5042,
  explorer: 'https://explorer.arc.io',
  readme: 'https://github.com/Sireadell/amana',
  deployBlock: 24583231,
  celoRpc: 'https://forno.celo.org',
  ngnFeed: '0xc17cBE2dB40e53F4984C46F608DA6DA1fF074c11',
  rateUrl: 'https://open.er-api.com/v6/latest/USD'
};
/* The fixed vault list inside the contract, in the same order. Only "live" ones can be chosen. */
const VAULTS = [
  { name: 'Aave USDC vault', label: 'Aave USDC', short: 'Aave', address: '0x42EAB64310E1D1c66b4d8aF7C9C4ce253885eB83', live: true, dec: 6 },
  { name: 'Steakhouse Prime USDC (Morpho)', label: 'Steakhouse Prime', short: 'Steakhouse', address: '0xbeef0016cb2Fd5C352ea7CA08a9f54739DFa7298', live: true, dec: 18 },
  { name: 'Bitwise Premium RWA USDC (Morpho)', label: 'Bitwise RWA', short: 'Bitwise', address: '0x7610094B846657dCF166D59e42973db52c7015F9', live: true, dec: 18 },
  { name: 'Steakhouse Prime USDC, second vault (Morpho)', label: 'Steakhouse Prime 2', short: 'Steakhouse 2', address: '0xbeef0007d5A04246F5382957035Df34f7e82102e', live: false, dec: 18 },
  { name: 'Keyrock Prime USDC (Morpho)', label: 'Keyrock Prime', short: 'Keyrock', address: '0x5bEfAb92a5A3D60F578Cb51EEb4e4FD50a1e3123', live: false, dec: 18 },
  { name: 'Galaxy USDC (Morpho)', label: 'Galaxy USDC', short: 'Galaxy', address: '0x8E357432CC12ff425c36432F312968aEb16112AF', live: false, dec: 18 },
  { name: 'Gauntlet USDC Prime (Morpho)', label: 'Gauntlet Prime', short: 'Gauntlet', address: '0xdECcd53BE5453215821184824B519E04C7e00bC7', live: false, dec: 18 }
];
const LIVE_MASK = VAULTS.reduce((m, v, i) => (v.live ? m | (1 << i) : m), 0);
const inMask = (mask, i) => ((Number(mask) >> i) & 1) === 1;
const shareTxt = (i, n) => Number(ethers.formatUnits(n, VAULTS[i].dec)).toLocaleString(undefined, { maximumFractionDigits: 6 });
const HF_ABI = [
  'function createRequest(uint256 amount,uint64 dueAt,address buyer,uint8 acceptMask) returns (uint256)',
  'function pledge(uint256 id,bytes32 termsHash,uint8 vaultIdx,uint256 shares)',
  'function pay(uint256 id,uint256 amount)',
  'function claim(uint256 id)',
  'function release(uint256 id)',
  'function reclaim(uint256 id)',
  'function cancel(uint256 id)',
  'function withdrawCredit()',
  'function credited(address) view returns (uint256)',
  'function requestCount() view returns (uint256)',
  'function getRequest(uint256 id) view returns (tuple(address seller,address buyer,uint8 state,uint64 dueAt,uint8 acceptMask,uint8 vaultIdx,uint256 amount,uint256 paid,uint256 shares,bytes32 termsHash))',
  'function claimOpensAt(uint256 id) view returns (uint256)',
  'function sharesNeededFor(uint256 amount,uint8 vaultIdx) view returns (uint256)',
  'function termsHashOf(uint256 id) view returns (bytes32)',
  'event RequestCreated(uint256 indexed id,address indexed seller,address indexed buyer,uint256 amount,uint64 dueAt,uint8 acceptMask,bytes32 termsHash)',
  'event Claimed(uint256 indexed id,address indexed seller,uint256 sharesToSeller,uint256 sharesToBuyer,uint256 owedAtClaim)'
];
const ERC_ABI = ['function approve(address,uint256) returns (bool)', 'function allowance(address,address) view returns (uint256)', 'function balanceOf(address) view returns (uint256)'];
const VAULT_ABI = [...ERC_ABI, 'function convertToAssets(uint256) view returns (uint256)', 'function redeem(uint256 shares,address receiver,address owner) returns (uint256)'];
const STATES = ['NONE', 'OPEN', 'PLEDGED', 'PAID', 'CLAIMED', 'RELEASED', 'RECLAIMED', 'CANCELLED'];
const GRACE = 3600, RECLAIM = 30 * 86400, MAX_TERM = 365 * 86400;

/* ?demo=1 only draws sample screens with made-up data. It never connects a wallet and never sends anything. */
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const DEMO_AS = Q.get('as') || 'visitor';
const DEMO_ME = '0x00000000000000000000000000000000000000aa';
const DEMO_SELLER = '0xb3fb' + '0'.repeat(32) + '2b53';
const DEMO_BUYER = '0x4c00' + '0'.repeat(32) + '91aa';

const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const S = { screen: 'home', step: 1, sub: '', reqId: null, cur: null, msg: null, target: 0, mtab: 'owed', minelist: undefined, all: null, accept: null, act: undefined };
let read, signer, account, hfR, vaultRs;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function retry(fn, n = 5) { for (let i = 0; ; i++) { try { return await fn(); } catch (e) { if (i >= n - 1 || !/32014|timeout|fetch|network|503|502/i.test(String(e.message))) throw e; await sleep(800 * (i + 1)); } } }

const num = (n, min = 0, max = 4) => (Number(n) / 1e6).toLocaleString(undefined, { minimumFractionDigits: min, maximumFractionDigits: max });
const usd = (n) => num(n, 0, 6) + ' USDC';
const worth0 = (n) => num(n, 0, 2) + ' USDC';
const worthTxt = (n) => num(n, 2, 4) + ' USDC';
const shortAddr = (a) => a.slice(0, 6) + '…' + a.slice(-4);
const dateTxt = (t) => new Date(Number(t) * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const dateShort = (t) => new Date(Number(t) * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dateTime = (t) => new Date(Number(t) * 1000).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const nowSec = () => Math.floor(Date.now() / 1000);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* naira: USDC stays the real money, naira is only shown next to it, from a live rate */
const N = { rate: null, on: true };
try { if (localStorage.getItem('amana_ngn') === 'off') N.on = false; const c = JSON.parse(localStorage.getItem('amana_rate') || 'null'); if (c && c.rate > 0) N.rate = c.rate; } catch {}
const ngn = (raw) => (N.rate && N.on) ? '₦' + Math.round(Number(raw) / 1e6 * N.rate).toLocaleString('en-NG') : '';
const ngnAbout = (raw) => ngn(raw) ? ' (about ' + ngn(raw) + ')' : '';
function paintNgnBtn() { const b = $('#ngnBtn'); if (!b) return; b.hidden = !N.rate; b.textContent = '₦ ' + (N.on ? 'on' : 'off'); }
/* Main source: Chainlink NGN/USD on Celo, read straight from the chain. Backup: a website rate. */
const FEED_ABI = ['function latestRoundData() view returns (uint80,int256,uint256,uint256,uint80)', 'function decimals() view returns (uint8)'];
async function chainlinkRate() {
  const p = new ethers.JsonRpcProvider(CFG.celoRpc, 42220, { staticNetwork: true });
  const f = new ethers.Contract(CFG.ngnFeed, FEED_ABI, p);
  const [d, r] = await Promise.all([f.decimals(), f.latestRoundData()]);
  const price = Number(r[1]) / 10 ** Number(d), at = Number(r[3]);
  if (!(price > 0) || nowSec() - at > 6 * 3600) throw new Error('stale');
  return { rate: 1 / price, src: 'Chainlink', at };
}
async function siteRate() {
  const j = await (await fetch(CFG.rateUrl)).json();
  const r = j && j.rates && j.rates.NGN;
  if (!(r > 0)) throw new Error('no rate');
  return { rate: r, src: 'a website rate', at: nowSec() };
}
async function loadRate() {
  let got = null;
  try { got = await chainlinkRate(); } catch { try { got = await siteRate(); } catch {} }
  if (got) {
    const moved = !N.rate || Math.abs(got.rate - N.rate) / N.rate > 0.0005;
    N.rate = got.rate; N.src = got.src; N.at = got.at;
    try { localStorage.setItem('amana_rate', JSON.stringify({ rate: got.rate })); } catch {}
    paintNgnBtn();
    if (moved) repaint(); else paintRateNote();
  } else paintNgnBtn();
}
function rateNote() {
  if (!N.rate || !N.src) return '';
  const mins = Math.max(0, Math.round((nowSec() - N.at) / 60));
  return `Naira rate: ₦${N.rate.toLocaleString('en-NG', { maximumFractionDigits: 2 })} per USDC from ${N.src}, ${mins < 1 ? 'just now' : mins + ' min ago'}. It changes all the time, and the amount stays fixed in USDC.`;
}
function paintRateNote() { document.querySelectorAll('.rateNote').forEach((el) => { el.textContent = N.on ? rateNote() : ''; }); }

/* keep what the person typed when the screen is drawn again (for example when the naira rate arrives) */
const KEEP = ['amt', 'due', 'who', 'unit', 'payAmt', 'num', 'rwal'];
function repaint() {
  const saved = {}; KEEP.forEach((i) => { const e = $('#' + i); if (e) saved[i] = e.value; });
  if (S.screen === 'request' || S.screen === 'share') { if (!S.cur || !S.cur.r) return; }
  if (S.screen === 'mine' && S.minelist === undefined) return;
  render();
  KEEP.forEach((i) => { const e = $('#' + i); if (e && saved[i] !== undefined) e.value = saved[i]; });
  if (saved.payAmt !== undefined && $('#payAmt')) $('#payAmt').dispatchEvent(new Event('input', { bubbles: true }));
  updateHelper();
  if (S.cur && S.cur.r) fillRecord(S.cur);
  if (S.screen === 'mine') paintMine();
}

/* every request on the contract (newest first), used for My requests and for buyer records */
async function allRequests() {
  if (S.all) return S.all;
  const n = Number(await retry(() => hfR.requestCount()));
  const ids = []; for (let i = n; i >= 1 && ids.length < 300; i--) ids.push(i);
  const out = [];
  for (let i = 0; i < ids.length; i += 25) {
    const part = await Promise.all(ids.slice(i, i + 25).map((id) => retry(() => hfR.getRequest(id)).then((r) => ({ id, r }))));
    out.push(...part);
  }
  S.all = out; return out;
}
function countFor(all, wallet) {
  const b = wallet.toLowerCase(); let paid = 0, missed = 0, active = 0, total = 0;
  for (const { r } of all) {
    if (r.buyer.toLowerCase() !== b) continue;
    total++;
    const s = STATES[Number(r.state)];
    if (s === 'PAID') paid++; else if (s === 'CLAIMED') missed++; else if (s === 'PLEDGED') active++;
  }
  return { paid, missed, active, total };
}
async function fillRecord(c) {
  if (!c || !c.r || c.r.buyer === ethers.ZeroAddress || DEMO) return;
  try {
    const all = await allRequests(); const k = countFor(all, c.r.buyer);
    const el = $('#rec'); if (!el) return;
    el.textContent = k.paid + k.missed + k.active === 0 ? 'This buyer has no finished requests on Amana yet.'
      : `This buyer on Amana: paid in full ${k.paid}, seller had to claim ${k.missed}, still open ${k.active}.`;
  } catch {}
}

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600); }
function setMsg(text, err, href, hrefText) {
  S.msg = text ? { text, err: !!err, href, hrefText } : null;
  paintMsg();
}
function paintMsg() {
  const el = $('#msg'); if (!el) return;
  el.textContent = ''; el.className = 'msg';
  if (!S.msg) return;
  if (S.msg.err) el.classList.add('err');
  el.append(S.msg.text);
  if (S.msg.href) { el.append(' '); const a = document.createElement('a'); a.href = S.msg.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = S.msg.hrefText; el.append(a); }
}
const msgEl = '<p class="msg" id="msg" role="status"></p>';

function setup() {
  read = new ethers.JsonRpcProvider(CFG.rpc, CFG.chainId, { staticNetwork: true });
  hfR = new ethers.Contract(CFG.amana, HF_ABI, read);
  vaultRs = VAULTS.map((v) => new ethers.Contract(v.address, VAULT_ABI, read));
}

const NO_WALLET = 'You need a crypto wallet for this, such as MetaMask or Rabby. Install one in this browser, then reload the page.';
async function connect() {
  if (DEMO) { toast('Demo screens only. Nothing is sent.'); return false; }
  if (!window.ethereum) { setMsg(NO_WALLET, true); if (!$('#msg')) toast(NO_WALLET); return false; }
  try {
    const bp = new ethers.BrowserProvider(window.ethereum);
    await bp.send('eth_requestAccounts', []);
    const hex = '0x' + CFG.chainId.toString(16);
    try { await bp.send('wallet_switchEthereumChain', [{ chainId: hex }]); }
    catch (e) {
      await bp.send('wallet_addEthereumChain', [{ chainId: hex, chainName: 'Arc', nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 }, rpcUrls: [CFG.rpc], blockExplorerUrls: [CFG.explorer] }]);
    }
    const p2 = new ethers.BrowserProvider(window.ethereum);
    signer = await p2.getSigner();
    account = (await signer.getAddress()).toLowerCase();
    $('#wallet').textContent = shortAddr(account);
    try { localStorage.removeItem('amana_off'); } catch {}
    return true;
  } catch (e) { setMsg('Could not connect your wallet: ' + friendly(e), true); return false; }
}
/* small menu under the address: copy it, or disconnect */
function walletMenu() {
  const old = $('#wmenu'); if (old) { old.remove(); return; }
  const b = $('#wallet'), r = b.getBoundingClientRect(), m = document.createElement('div');
  m.id = 'wmenu'; m.style.cssText = 'position:fixed;z-index:60;top:' + (r.bottom + 6) + 'px;right:' + Math.max(8, innerWidth - r.right) + 'px';
  m.innerHTML = '<button type="button" data-w="copy">Copy address</button><button type="button" data-w="off">Disconnect</button>';
  document.body.append(m);
  m.onclick = async (e) => {
    const k = e.target.dataset.w; if (!k) return;
    if (k === 'copy') { try { await navigator.clipboard.writeText(ethers.getAddress(account)); toast('Address copied.'); } catch { toast('Could not copy.'); } m.remove(); return; }
    try { localStorage.setItem('amana_off', '1'); } catch {}
    try { await window.ethereum.request({ method: 'wallet_revokePermissions', params: [{ eth_accounts: {} }] }); } catch {}
    location.reload();
  };

/* when each request was made: the RPC only allows short log ranges, so look back in slices, newest first, and remember the answers */
async function createdTimes(ids) {
  let known = {}; try { known = JSON.parse(localStorage.getItem('amana_born') || '{}'); } catch {}
  const need = ids.filter((id) => !known[id]);
  if (need.length) {
    try {
      const head = await retry(() => read.getBlockNumber()), SLICE = 9000, found = {};
      for (let h = head; h >= CFG.deployBlock && need.some((id) => !found[id]); h -= SLICE) {
        const l = Math.max(CFG.deployBlock, h - SLICE + 1); await sleep(250);
        let evs = null;
        for (let t = 0; t < 3 && !evs; t++) { try { evs = await hfR.queryFilter(hfR.filters.RequestCreated(), l, h); } catch { await sleep(600 * (t + 1)); } }
        for (const e of evs || []) { const id = Number(e.args.id); if (need.includes(id)) found[id] = e.blockNumber; }
      }
      for (const id of need) if (found[id]) known[id] = (await retry(() => read.getBlock(found[id]))).timestamp;
      try { localStorage.setItem('amana_born', JSON.stringify(known)); } catch {}
    } catch {}
  }
  return known;
}
/* shares the seller received in a claim: the RPC only allows short log ranges, so look back in slices, newest first, and remember the answer */
async function claimedShares(id) {
  let known = {}; try { known = JSON.parse(localStorage.getItem('amana_claimed') || '{}'); } catch {}
  if (known[id]) return BigInt(known[id]);
  try {
    const head = await retry(() => read.getBlockNumber()), SLICE = 9000;
    for (let h = head; h >= CFG.deployBlock; h -= SLICE) {
      const l = Math.max(CFG.deployBlock, h - SLICE + 1); await sleep(250);
      let evs = null;
      for (let t = 0; t < 3 && !evs; t++) { try { evs = await hfR.queryFilter(hfR.filters.Claimed(id), l, h); } catch { await sleep(600 * (t + 1)); } }
      if (evs === null) return null;
      if (evs.length) {
        const v = evs[evs.length - 1].args.sharesToSeller;
        try { known[id] = v.toString(); localStorage.setItem('amana_claimed', JSON.stringify(known)); } catch {}
        return v;
      }
    }
  } catch {}
  return null;
}
async function loadActivity() {
  const paint = () => { const b = $('#actBody'); if (b && S.screen === 'home') b.innerHTML = actHtml(); };
  if (DEMO) {
    const t = nowSec(), a = DEMO_SELLER;
    S.act = [{ id: 105, state: 'PAID', amount: 50000000n, seller: a, ts: t - 3600 }, { id: 102, state: 'PLEDGED', amount: 200000000n, seller: a, ts: t - 3 * 3600 }, { id: 101, state: 'OPEN', amount: 120000000n, seller: a, ts: t - 5 * 3600 }];
    paint(); return;
  }
  if (S.act !== undefined && S.act !== null) { paint(); return; }
  try {
    const n = Number(await retry(() => hfR.requestCount()));
    if (!n) { S.act = []; paint(); return; }
    const ids = []; for (let i = n; i >= 1 && ids.length < 3; i--) ids.push(i);
    const times = await createdTimes(ids);
    S.act = await Promise.all(ids.map(async (id) => {
      const r = await retry(() => hfR.getRequest(id));
      const ts = times[id] || 0;
      return { id, state: STATES[Number(r.state)], amount: r.amount, seller: r.seller, ts };
    }));
  } catch (e) { S.act = null; }
  paint();
}

    const state = STATES[Number(r.state)], late = state === 'PLEDGED' && now >= Number(r.dueAt);

    const act = late && S.mtab === 'owed' && claimable ? 'Claim' : late && S.mtab === 'owe' ? 'Pay' : 'Open';
    return { id, r, chip: chipFor(state, late), act };
  });
  box.innerHTML = `<div class="list ph">${info.map((x) => `<a class="card rowcard" href="#/request/${x.id}"><div class="top2"><b>#${x.id}</b><span class="fig">${usd(x.r.amount)}</span>${x.chip}</div><div class="s">Due ${dateShort(x.r.dueAt)}${ngn(x.r.amount) ? ' · ' + ngn(x.r.amount) : ''}</div></a>`).join('')}</div>
    <table class="dk"><tr><th>#</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr>${info.map((x) => `<tr><td>${x.id}</td><td class="fig">${usd(x.r.amount)}${ngn(x.r.amount) ? '<small>' + ngn(x.r.amount) + '</small>' : ''}</td><td>${dateShort(x.r.dueAt)}</td><td>${x.chip}</td><td><a href="#/request/${x.id}">${x.act}</a></td></tr>`).join('')}</table>`;
}
async function loadMine() {
  if (DEMO) { S.minelist = [101, 102, 103, 104, 105, 106, 107].map((id) => ({ id, r: demoReq(id) })).reverse(); paintMine(); return; }

}

function requestHtml(c) {
  if (c.err) return c.err;
  const { r, state, now, owed, role } = c;
  if (S.screen === 'share') return shareHtml(c);
  const isS = role === 'seller', isB = role === 'buyer';
  const amt = usd(r.amount), amtN = num(r.amount, 0, 6);
  const passed = now >= Number(r.dueAt);
  const late = state === 'PLEDGED' && passed;
  const claimable = state === 'PLEDGED' && now >= c.claimOpens;
  const need = worth0(c.neededWorth);
  const dueS = dateShort(r.dueAt);
  const buyerPledging = state === 'OPEN' && isB && !passed;
  const sub = buyerPledging ? (S.sub === 'pledge' ? 'pledge' : 'review') : '';
  S.target = 0;

  /* ---- left side: what is owed ---- */
  const open = state === 'OPEN' || state === 'PLEDGED';
  const label = isB ? (open ? 'You owe' : 'You owed') : isS ? (open ? 'You are owed' : 'You were owed') : 'Owed';
  const l1 = [ngn(r.amount) ? 'About ' + ngn(r.amount) : '', (state === 'PLEDGED' || state === 'OPEN') ? 'due ' + dueS : ''].filter(Boolean).join(' · ');
  let owedBox = `<div class="s">${label}</div><div class="big fig">${amtN} <span class="s">USDC</span></div>${l1 ? `<div class="s">${l1.charAt(0).toUpperCase() + l1.slice(1)}</div>` : ''}`;
  if (state === 'PLEDGED') {
    const pct = Math.min(100, Number(r.paid * 100n / r.amount));
    const left = Math.max(0, Math.ceil((Number(r.dueAt) - now) / 86400));
    owedBox += `<div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <div class="s">${num(r.paid, 0, 6)} paid · ${num(owed, 0, 6)} left${late ? ' · overdue' : ' · ' + left + ' day' + (left === 1 ? '' : 's')}</div>`;
    if (!claimable) {
      S.target = (!late && !isS) ? Number(r.dueAt) : c.claimOpens;
      const lbl = isS ? 'You can claim in' : late ? 'The seller can claim in' : 'Due date in';
      owedBox += `<div class="s clockrow">${lbl} <b class="clock" id="clock">${clockTxt(S.target - now)}</b></div>`;
    }
  } else if (state === 'CLAIMED') owedBox += `<div class="s">${num(r.paid, 0, 6)} paid · ${num(owed, 0, 6)} claimed by the seller</div>`;
  let colA = `<div class="card owed">${owedBox}</div>`;
  if (buyerPledging) colA += `<div class="card">You back it with <b>${need}</b> of savings (105%). Your savings keep earning while they are pledged.</div><div class="btns ph"><a class="btn" href="#/request/${c.id}/pledge">Continue</a></div>`;
  if (r.buyer !== ethers.ZeroAddress) colA += '<p class="record" id="rec"></p>';

  /* ---- right side: the actions ---- */
  let h = '', body = '', extra = '', btns = '', tag = '';
  if (state === 'OPEN') {
    if (passed) { h = 'The due date has passed.'; body = 'Nobody pledged before the date, so this request can no longer be pledged.'; btns = isS ? '<button class="btn g" data-act="cancel" type="button">Cancel this request</button>' : backHome; }
    else if (isS) {
      tag = 'Seller view'; h = "Waiting for the buyer's pledge.";
      body = `Send the request link to the buyer. Nothing is protected yet, and you can cancel before they pledge. The buyer must pledge at least ${need} of savings (105%).`;
      btns = '<button class="btn g" data-act="send" type="button">Send on WhatsApp</button><button class="btn o" data-act="copy" type="button">Copy link</button><button class="btn o" data-act="cancel" type="button">Cancel this request</button>';
    } else if (isB) {
      tag = 'Pick savings';
      const needRow = `<div class="need"><span class="s">You need to pledge at least</span><span class="fig"><b>${need}</b> worth${ngnAbout(c.neededWorth)}</span></div>`;
      if (!c.holdings) extra = needRow + '<p class="s">We could not read your savings yet. Reload in a moment.</p>';
      else {
        const rows = c.holdings.map((x) => {
          const v = VAULTS[x.i];
          const st = !x.live ? '<small>Coming soon</small>' : x.enough ? '<small class="ok">Enough</small>' : '<small class="no">Not enough</small>';
          return `<label class="opt"><input type="radio" name="vault" value="${x.i}" ${x.i === c.choice ? 'checked' : ''} ${x.live ? '' : 'disabled'}><span class="n">${v.label}</span><span class="r"><b class="fig">${worth0(x.haveWorth)}</b>${ngn(x.haveWorth) ? '<span class="fig">' + ngn(x.haveWorth) + '</span>' : ''}${st}</span></label>`;
        }).join('');
        const any = c.holdings.some((x) => x.live && x.enough);
        extra = needRow + `<div class="tiles">${rows}</div>` + (any ? '' : '<p class="err" style="margin-top:10px;font-weight:600">You do not have enough yet.</p><p class="hint">First deposit USDC into one of these vaults, then come back.</p>');
      }
      body = '';
      extra += '<div class="card k s" style="margin-top:12px">Nothing is sold. Your savings are locked, not cashed out.</div>';
      btns = `<button class="btn g" data-act="pledge" type="button">Pledge ${need}</button>`;
    } else if (role === 'other') { h = 'This request is for a different wallet.'; body = 'The seller named another buyer for this request, so only that wallet can pledge.'; btns = backHome; }
    else {
      tag = 'Buyer view'; h = "Waiting for the buyer's pledge.";
      body = `The buyer must pledge at least ${need} of savings in an accepted vault (${c.accepted.map((i) => VAULTS[i].label).join(', ')}). Connect your wallet to see whether you already have enough.`;
      btns = '<button class="btn g" data-act="connect" type="button">Connect wallet to pledge</button>';
    }
  } else if (state === 'PLEDGED') {
    const pw = c.worth != null ? worth0(c.worth) : '';
    if (!late) {
      h = isS ? "The buyer's pledge is in place." : 'Your promise is backed by your savings.';
      body = isS ? `The buyer pledged ${pw} of savings. You cannot claim early. If they pay another way, release the pledge.`
        : isB ? `Your ${pw} of savings is held by Amana and keeps earning. Pay ${usd(owed)} before the seller claims to get every share back.`
        : `The buyer pledged ${pw} of savings. It is held by Amana and keeps earning for them.`;
    } else if (!claimable) {
      h = 'The due date has passed.';
      body = isB ? 'You can still pay before the seller claims.' : 'The claim opens one hour after the due date.';
    } else {
      h = isS ? 'You can claim now.' : 'The request is overdue.';
      body = isS ? 'It opens 1 hour after the date. You take only what you are owed. The rest goes back to the buyer in the same step.'
        : `You can still pay before the seller claims. If they claim first, they take shares worth ${usd(owed)} and you get the rest back.`;
    }
    if (isS) {
      tag = 'Seller view';
      btns = claimable ? '<button class="btn g" data-act="claim" type="button">Claim savings</button>'
        : `<button class="btn" type="button" disabled>Claim opens ${dateShort(c.claimOpens)}, 1 hour after the due date</button>`;
      btns += '<button class="btn o" data-act="release" type="button">I was paid, release the pledge</button><button class="btn o" data-act="remind" type="button">Send reminder on WhatsApp</button>';
    } else if (isB) {
      tag = 'Buyer view';
      extra = `<label class="f" style="margin-top:12px"><span>Pay</span><input id="payAmt" class="fig" inputmode="decimal" aria-label="Amount in USDC" value="${ethers.formatUnits(owed, 6).replace(/\.0$/, '')}"></label>
        <p class="hint" id="payHint">You can pay all of it, or part now and the rest later. Your pledge comes back once it is all paid.</p>`;
      btns = `<button class="btn g" data-act="pay" id="payBtn" type="button">Pay now</button><button class="btn o" id="halfBtn" type="button">Pay half</button>`;
      if (now >= c.claimOpens + RECLAIM) btns = '<button class="btn g" data-act="reclaim" type="button">Take my pledge back</button><button class="btn o" data-act="pay" type="button">Pay ' + usd(owed) + ' instead</button>';
    } else if (role === 'other') btns = backHome;
    else { tag = 'Visitor'; body += " Connect the seller's or buyer's wallet to act on this request."; btns = '<button class="btn g" data-act="connect" type="button">Connect wallet</button>'; }
  } else {
    const T = {
      PAID: ['Paid in full', `Seller received <b>${usd(r.amount)}</b>.<br>Buyer got every pledged share back, plus what it earned.`],
      CLAIMED: ['Seller claimed what was owed.', `The seller received shares worth <b>${usd(r.amount - r.paid)}</b>. The remaining shares went back to the buyer in the same step.`],
      RELEASED: ['Pledge released.', 'The seller released the request, so all pledged shares went back to the buyer.'],
      RECLAIMED: ['The buyer took the pledge back.', 'The seller did nothing for 30 days after the claim opened, so the buyer took all the pledged shares back.'],
      CANCELLED: ['Request cancelled.', 'The seller cancelled before anyone pledged. Nothing was locked.']
    }[state];
    h = T[0]; body = T[1];
    if (state === 'PAID') btns = `<a class="btn o" href="${CFG.explorer}/address/${CFG.amana}" target="_blank" rel="noopener">View on explorer</a>`;
    else btns = backHome;
    if (isS && state === 'CLAIMED' && c.cashShares > 0n) {
      extra = `<div class="t2" style="margin-top:14px">Turn it into USDC</div><p class="s">Amana checks the vault has the cash first.</p><div class="card k" style="margin-top:10px"><b class="fig">≈ ${worth0(c.cashWorth)}</b>${ngn(c.cashWorth) ? ' · about ' + ngn(c.cashWorth) : ''}</div>`;
      btns = '<button class="btn g" data-act="cashout" type="button">Cash out</button>' + btns.replace('class="btn"', 'class="btn o"');
    }
  }
  if (isS && c.credit > 0n) btns += `<button class="btn o" data-act="withdraw" type="button">Collect ${usd(c.credit)} held for me</button>`;

  const colB = `<div class="card acts">${tag ? `<div class="s${tag === 'Pick savings' ? ' dk' : ''}">${tag}</div>` : ''}${h ? `<div class="t2" style="${tag ? 'margin-top:4px' : ''}">${h}</div>` : ''}${body ? `<p>${body}</p>` : ''}${extra}<div class="btns">${btns}</div></div>`;

  const headDk = `<h1 class="t dk">Request #${c.id} ${chipFor(state, late)}</h1>`;
  const headPh = sub === 'pledge' ? phHead('Pick savings', 'You hold') : sub === 'review' ? phHead(`Request #${c.id}`, `from ${shortAddr(r.seller)}`) : phHead(`Request #${c.id}`, chipFor(state, late));
  return `<div class="rq" data-sub="${sub}" style="display:flex;flex-direction:column;gap:12px">${headPh}${headDk}${tlHtml(c)}
    <div class="two"><div class="colA">${colA}</div><div class="colB">${colB}</div></div>
    ${msgEl}${detailsHtml(c)}</div>`;
}

/* ---------- demo data: made-up requests so every screen can be seen without a wallet ---------- */
function demoReq(id) {
  const now = nowSec(), U = 1000000n, Z = ethers.ZeroAddress;
  const seller = DEMO_AS === 'seller' ? DEMO_ME : DEMO_SELLER;
  const buyerMe = DEMO_AS === 'buyer' ? DEMO_ME : DEMO_BUYER;
  const mk = (state, amount, paid, dueIn, shares, buyer) => ({ seller, buyer, state: BigInt(state), dueAt: BigInt(now + dueIn), acceptMask: 7n, vaultIdx: 1n, amount: BigInt(amount) * U, paid: BigInt(paid) * U, shares: BigInt(shares) * U, termsHash: '0x' + '00'.repeat(32) });
  switch (id) {
    case 101: return mk(1, 200, 0, 30 * 86400, 0, Z);
    case 102: return mk(2, 200, 120, 9 * 86400, 210, buyerMe);
    case 103: return mk(2, 120, 0, -600, 126, buyerMe);
    case 104: return mk(2, 120, 0, -3 * 86400, 126, buyerMe);
    case 105: return mk(3, 50, 50, -20 * 86400, 0, buyerMe);
    case 106: return mk(4, 200, 120, -5 * 86400, 0, buyerMe);
    case 107: return mk(7, 75, 0, 12 * 86400, 0, Z);
    default: return mk(0, 0, 0, 0, 0, Z);
  }
}
function demoExtras(c) {
  const ex = {};
  if (c.r.shares > 0n) ex.worth = c.r.shares;
  if (c.role === 'buyer' && c.state === 'OPEN') {
    const have = [35, 412, 0];
    ex.holdings = c.accepted.map((i) => { const hw = BigInt(have[i] || 0) * 1000000n; return { i, have: hw, haveWorth: hw, need: c.neededWorth, enough: hw >= c.neededWorth, live: VAULTS[i].live }; });
    ex.choice = 1;
  }
  if (c.role === 'seller' && c.state === 'CLAIMED') { ex.cashShares = 80000000n; ex.cashWorth = 80000000n; }
  return ex;
}

/* ---------- loading a request ---------- */
function makeC(id, r) {
  const state = STATES[Number(r.state)], now = nowSec();
  const claimOpens = Number(r.dueAt) + GRACE, owed = r.amount - r.paid;
  const isSeller = !!account && r.seller.toLowerCase() === account;
  const isBuyer = !!account && (r.buyer.toLowerCase() === account || (state === 'OPEN' && r.buyer === ethers.ZeroAddress && !isSeller));
  const role = isSeller ? 'seller' : isBuyer ? 'buyer' : (account ? 'other' : 'visitor');
  const vi = Number(r.vaultIdx);
  const accepted = VAULTS.map((v, i) => i).filter((i) => inMask(r.acceptMask, i));
  return { id, r, state, now, claimOpens, owed, role, credit: 0n, worth: null, neededWorth: (r.amount * 105n + 99n) / 100n, holdings: null, accepted, vi, at: Date.now() };
}
const errBox = (t, p) => `<div class="card" style="border-color:var(--bad-line);background:var(--bad-tint)"><div class="t2">${t}</div><p>${p}</p></div><div class="btns">${backHome}</div>`;
const stillHere = (id) => String(S.reqId) === String(id) && (S.screen === 'request' || S.screen === 'share');

async function loadRequest(id, keepMsg) {
  id = String(id);
  S.reqId = id;
  if (!keepMsg) { S.msg = null; main.innerHTML = skeletonHtml(); }
  let r;
  try { r = DEMO ? demoReq(Number(id)) : await retry(() => hfR.getRequest(id)); }
  catch (e) { if (!stillHere(id)) return; S.cur = { id, err: errBox('Could not read Arc right now.', 'Reload in a moment.'), at: Date.now() }; render(); return; }
  if (!stillHere(id)) return;
  if (Number(r.state) === 0) { S.cur = { id, err: errBox('No such request.', `There is no request number ${esc(id)}. Check the number with the seller.`), at: Date.now() }; render(); return; }
  const c = makeC(id, r);
  if (DEMO) Object.assign(c, demoExtras(c));
  else {
    try {
      if (r.shares > 0n) c.worth = await retry(() => vaultRs[c.vi].convertToAssets(r.shares));
      if (c.role === 'buyer' && c.state === 'OPEN') {
        c.holdings = await Promise.all(c.accepted.map(async (i) => {
          const have = await retry(() => vaultRs[i].balanceOf(account));
          const haveWorth = have > 0n ? await retry(() => vaultRs[i].convertToAssets(have)) : 0n;
          const need = await retry(() => hfR.sharesNeededFor(r.amount, i));
          return { i, have, haveWorth, need, enough: have >= need, live: VAULTS[i].live };
        }));
        const pick = c.holdings.find((h) => h.live && h.enough) || c.holdings.find((h) => h.live) || c.holdings[0];
        c.choice = pick ? pick.i : null;
      }
      if (c.role === 'seller') c.credit = await retry(() => hfR.credited(account));
      if (c.role === 'seller' && c.state === 'CLAIMED') {
        let claimed = null;
        claimed = await claimedShares(id);
        const have = await retry(() => vaultRs[c.vi].balanceOf(account));
        const sh = claimed == null ? have : (claimed < have ? claimed : have);
        c.cashShares = sh; c.cashWorth = sh > 0n ? await retry(() => vaultRs[c.vi].convertToAssets(sh)) : 0n;
      }
    } catch (e) { /* show what we have; actions re-check on click */ }
  }
  if (!stillHere(id)) return;
  c.at = Date.now();
  S.cur = c;
  render();
  fillRecord(c);
}

/* ---------- actions ---------- */
async function createReq() {
  setMsg('');
  let amt = $('#amt').value.trim().replace(/,/g, ''); const due = $('#due').value, buyer = $('#who').value.trim();
  if ($('#unit') && $('#unit').value === 'NGN' && N.rate && /^\d+(\.\d{1,2})?$/.test(amt)) amt = (Math.round(Number(amt) / N.rate * 100) / 100).toFixed(2);
  if (!/^\d+(\.\d{1,6})?$/.test(amt) || Number(amt) < 1) { toStep(1); return setMsg('Enter an amount of at least 1 USDC.', true); }
  if (!due) { toStep(1); return setMsg('Pick the date you want to be paid by.', true); }
  if (buyer && !ethers.isAddress(buyer)) { toStep(1); return setMsg('That buyer address is not valid.', true); }
  const dueAt = Math.floor(new Date(due + 'T23:59:00').getTime() / 1000);
  if (dueAt <= nowSec()) { toStep(1); return setMsg('Pick a date in the future.', true); }
  if (dueAt > nowSec() + MAX_TERM - 3600) { toStep(1); return setMsg('The date can be at most one year away.', true); }
  let mask = 0;
  document.querySelectorAll('input[name="accept"]:checked').forEach((el) => { mask |= 1 << Number(el.value); });
  mask &= LIVE_MASK;
  if (!mask) return setMsg('Pick at least one kind of savings you accept.', true);
  if (DEMO) { toast('Demo screens only. Nothing is sent.'); return; }
  if (!(await connect())) return;
  try {
    setMsg('Confirm in your wallet...');
    const hf = new ethers.Contract(CFG.amana, HF_ABI, signer);
    const t = await hf.createRequest(ethers.parseUnits(amt, 6), dueAt, buyer || ethers.ZeroAddress, mask);
    setMsg('Sent, waiting for Arc...');
    const rc = await t.wait();
    let id;
    for (const l of rc.logs) { try { const p = hf.interface.parseLog(l); if (p && p.name === 'RequestCreated') id = p.args.id; } catch {} }
    if (id === undefined) id = await hf.requestCount();
    S.cur = null; S.all = null; S.minelist = undefined; S.accept = null;
    location.hash = '#/share/' + id.toString();
  } catch (e) { setMsg('Failed: ' + friendly(e), true); }
}
function toStep(n) { if (S.step !== n) { if (n === 1) { history.length > 1 && location.hash.endsWith('/2') ? history.back() : (location.hash = '#/new'); } else location.hash = '#/new/2'; } }

const hfW = () => new ethers.Contract(CFG.amana, HF_ABI, signer);
async function act(name) {
  const c = S.cur; if (!c) return;
  if (name === 'copy') { try { await navigator.clipboard.writeText(shareLink(c.id)); toast('Link copied.'); } catch { toast('Copy this link: ' + shareLink(c.id)); } return; }
  if (name === 'send' || name === 'remind') {
    const link = shareLink(c.id), how = `${usd(c.r.amount)}${ngnAbout(c.r.amount)}`, due = dateTxt(c.r.dueAt);
    const text = name === 'send'
      ? `Hello, I am asking for ${how} by ${due}. You can back your promise with the vault savings you already have, so you do not have to cash anything out and it keeps earning. Open the request here: ${link}`
      : `Hello, a reminder that ${usd(c.owed)}${ngnAbout(c.owed)} is due on ${due}. You can pay it here, and your pledged savings come back to you: ${link}`;
    try { await navigator.clipboard.writeText(link); toast('Link copied.'); } catch {}
    if (!DEMO) window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
    return;
  }
  if (name === 'connect') { if (await connect()) loadRequest(c.id); return; }
  if (!(await ensure())) return;
  if (name === 'pledge') {
    const pick = document.querySelector('input[name="vault"]:checked');
    const idx = pick ? Number(pick.value) : c.choice;
    if (idx == null || !c.accepted.includes(idx)) return setMsg('Pick the savings you want to pledge.', true);
    if (!VAULTS[idx].live) return setMsg(VAULTS[idx].short + ' is coming soon and cannot be pledged yet.', true);
    let need, have;
    try {
      need = await retry(() => hfR.sharesNeededFor(c.r.amount, idx));
      have = await retry(() => vaultRs[idx].balanceOf(account));
    } catch (e) { return setMsg('Could not read your balance: ' + friendly(e), true); }
    if (have < need) return setMsg(`You need ${shareTxt(idx, need)} ${VAULTS[idx].short} shares in this wallet. You have ${shareTxt(idx, have)}. Deposit USDC into that vault first, or pick another one.`, true);
    const v = new ethers.Contract(VAULTS[idx].address, VAULT_ABI, signer);
    if (!(await tx('Approve the exact shares', () => v.approve(CFG.amana, need)))) return;
    await tx('Pledge', () => hfW().pledge(c.id, c.r.termsHash, idx, need));
  } else if (name === 'pay') {
    const raw = ($('#payAmt') ? $('#payAmt').value : '').trim();
    let amt = c.owed;
    if (raw) {
      if (!/^\d+(\.\d{1,6})?$/.test(raw) || Number(raw) <= 0) return setMsg('Enter an amount to pay, like 50.', true);
      amt = ethers.parseUnits(raw, 6);
      if (amt > c.owed) amt = c.owed;
    }
    const u = new ethers.Contract(CFG.usdc, ERC_ABI, signer);
    try { const bal = await retry(() => u.balanceOf(account)); if (bal < amt) return setMsg(`You need ${usd(amt)} in this wallet to pay. You have ${usd(bal)}.`, true); } catch {}
    if (!(await tx('Approve the USDC', () => u.approve(CFG.amana, amt)))) return;
    await tx(amt < c.owed ? 'Part payment' : 'Pay', () => hfW().pay(c.id, amt));
  } else if (name === 'cashout') {
    const v = new ethers.Contract(VAULTS[c.vi].address, VAULT_ABI, signer);
    let sh = c.cashShares;
    try { const have = await retry(() => vaultRs[c.vi].balanceOf(account)); if (sh > have) sh = have; } catch {}
    if (!sh || sh <= 0n) return setMsg('There is nothing to cash out right now.', true);
    // Some vaults lend their cash out, so ask first whether the vault can pay this today.
    try { await v.redeem.staticCall(sh, account, account); }
    catch (e) { return setMsg(`${VAULTS[c.vi].short} does not have enough cash to pay this out today. Your shares are safe. Try again later.`, true); }
    await tx('Cash out', () => v.redeem(sh, account, account));
  } else if (name === 'claim') await tx('Claim', () => hfW().claim(c.id));
  else if (name === 'release') await tx('Release', () => hfW().release(c.id));
  else if (name === 'cancel') await tx('Cancel', () => hfW().cancel(c.id));
  else if (name === 'reclaim') await tx('Take back', () => hfW().reclaim(c.id));
  else if (name === 'withdraw') await tx('Collect', () => hfW().withdrawCredit());
}

function openNumber(v) {
  v = (v || '').trim();
  if (!/^\d+$/.test(v) || v === '0') { setMsg('Enter a request number, like 1.', true); return; }
  location.hash = '#/request/' + v;
}

/* the form on New request: amount helper, naira line, live preview */
function updateHelper() {
  if (!$('#amt')) return;
  let v = ($('#amt').value || '').trim().replace(/,/g, '');
  const inNgn = $('#unit') && $('#unit').value === 'NGN' && N.rate;
  let n = /^\d+(\.\d{1,6})?$/.test(v) ? Number(v) : null;
  if (n !== null && inNgn) { n = Math.round(n / N.rate * 100) / 100; v = String(n); }
  const fmt = (x) => x.toLocaleString(undefined, { maximumFractionDigits: 2 });
  const nl = $('#ngnLine'); if (nl) nl.textContent = n === null || !N.rate || !N.on ? '' : inNgn ? 'About ' + fmt(n) + ' USDC' : 'About ₦' + Math.round(n * N.rate).toLocaleString('en-NG') + ' today';
  const need = n === null ? null : Math.ceil(n * 105) / 100;
  const ht = n === null ? 'The buyer must pledge at least 105% of the amount owed, in vault savings.'
    : `${inNgn ? 'That is about ' + v + ' USDC at today\'s rate, and it is fixed in USDC once you make the request. ' : ''}For ${v} USDC due, the buyer must pledge at least ${fmt(need)} USDC worth${N.rate && N.on ? ' (about ₦' + Math.round(need * N.rate).toLocaleString('en-NG') + ')' : ''} of vault savings.`;
  document.querySelectorAll('.helper').forEach((h) => { h.textContent = ht; });
  const pa = $('#pvAmt'); if (pa) pa.textContent = n === null ? '0' : fmt(n);
  const dv = $('#due') && $('#due').value; let ds = '';
  if (dv) { const d = new Date(dv + 'T12:00:00'); if (!isNaN(d)) ds = 'due ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  const pn = $('#pvNgn'); if (pn) pn.textContent = [n !== null && N.rate && N.on ? 'About ₦' + Math.round(n * N.rate).toLocaleString('en-NG') : '', ds].filter(Boolean).join(' · ').replace(/^./, (x) => x.toUpperCase());
  const pt = $('#pvTerms'); if (pt) pt.innerHTML = need === null ? 'They put up at least 105% of the amount in savings.' : `They put up <b>${fmt(need)} USDC</b> of savings (105%). It keeps earning.`;
}

/* ---------- render and router ---------- */
function viewHtml() {
  switch (S.screen) {
    case 'new': return newHtml(S.step);
    case 'open': return openHtml();
    case 'mine': return mineHtml();
    case 'record': return recordHtml();
    case 'about': return aboutHtml();
    case 'request': case 'share': return S.cur && String(S.cur.id) === String(S.reqId) ? requestHtml(S.cur) : skeletonHtml();
    default: return homeHtml();
  }
}
function render() {
  main.innerHTML = viewHtml();
  main.style.animation = 'none'; void main.offsetWidth; main.style.animation = '';
  if (S.screen === 'new') {
    const due = $('#due');
    if (due) { const t = new Date(Date.now() + 30 * 86400000); due.value = S.dueVal || (t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0')); due.min = new Date().toISOString().slice(0, 10); }
    updateHelper();
  }
  if (S.screen === 'mine') paintMine();
  paintMsg();
}
function paintNav() {
  const key = { home: 'home', open: 'home', new: 'new', mine: 'mine', request: 'mine', share: 'mine', record: 'record', about: 'about' }[S.screen] || 'home';
  document.querySelectorAll('[data-nav]').forEach((a) => { a.classList.toggle('on', a.dataset.nav === key); if (a.dataset.nav === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
const SCREENS = ['home', 'new', 'open', 'mine', 'record', 'about', 'request', 'share'];
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let name = parts[0] || 'home';
  if (!SCREENS.includes(name)) name = 'home';
  if ((name === 'request' || name === 'share') && !/^[1-9]\d*$/.test(parts[1] || '')) name = 'home';
  const sameNew = name === 'new' && S.screen === 'new' && $('#newForm');
  S.screen = name; S.step = (name === 'new' && parts[1] === '2') ? 2 : 1; S.sub = parts[2] || '';
  paintNav();
  if (sameNew) { $('#newForm').dataset.step = S.step; window.scrollTo(0, 0); return; }
  S.msg = null; S.target = 0;
  if (name === 'request' || name === 'share') {
    S.reqId = parts[1];
    if (S.cur && String(S.cur.id) === parts[1] && Date.now() - S.cur.at < 30000) render(); else loadRequest(parts[1]);
  } else {
    render();
    if (name === 'mine') loadMine();
    if (name === 'home') loadActivity();
    if (name === 'record' && !DEMO && account && $('#rwal') && $('#rwal').value) lookupRecord();
    if (name === 'record' && DEMO) lookupRecord();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'ngnBtn') { N.on = !N.on; try { localStorage.setItem('amana_ngn', N.on ? 'on' : 'off'); } catch {} paintNgnBtn(); repaint(); return; }
  if (t.id === 'halfBtn') {
    const el = $('#payAmt');
    if (el && S.cur) { el.value = (Number(S.cur.owed / 2n) / 1e6).toFixed(6).replace(/\.?0+$/, ''); el.dispatchEvent(new Event('input', { bubbles: true })); act('pay'); }
    return;
  }
  if (t.id === 'wallet' && account) { walletMenu(); return; }
  if (t.id === 'wallet') { connect().then((ok) => { if (ok) { S.all = null; if (S.cur && (S.screen === 'request' || S.screen === 'share')) loadRequest(S.cur.id, true); else if (S.screen === 'mine') loadMine(); else if (S.screen === 'record') { const w = $('#rwal'); if (w && !w.value) w.value = account; } } }); return; }
  if (t.dataset.mtab) { S.mtab = t.dataset.mtab; paintMine(); return; }
  if (t.hasAttribute('data-next')) {
    const amt = ($('#amt').value || '').trim().replace(/,/g, '');
    if (!/^\d+(\.\d{1,6})?$/.test(amt) || Number(amt) <= 0) { setMsg('Enter how much you are owed.', true); return; }
    if (!$('#due').value) { setMsg('Pick the date you want to be paid by.', true); return; }
    setMsg(''); location.hash = '#/new/2'; return;
  }
  if (t.hasAttribute('data-create')) { createReq(); return; }
  if (t.hasAttribute('data-openreq')) { openNumber($('#num').value); return; }
  if (t.hasAttribute('data-look')) { lookupRecord(); return; }
  if (t.dataset.act) { act(t.dataset.act); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'amt') updateHelper();
  if (e.target.id === 'payAmt' && S.cur) {
    const raw = e.target.value.trim(), ok = /^\d+(\.\d{1,6})?$/.test(raw) && Number(raw) > 0;
    const amt = ok ? ethers.parseUnits(raw, 6) : 0n, shown = amt > S.cur.owed ? S.cur.owed : amt;
    const b = $('#payBtn'); if (b && ok) b.textContent = shown < S.cur.owed ? 'Pay ' + usd(shown) + ' now' : 'Pay now';
    const h = $('#payHint'); if (h && ok) h.textContent = shown < S.cur.owed ? `${usd(S.cur.owed - shown)} will still be owed. Your pledge stays locked until it is all paid.` : 'This pays everything and frees your whole pledge.';
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'unit' || e.target.id === 'due') updateHelper();
  if (e.target.id === 'due') S.dueVal = e.target.value;
  if (e.target.name === 'accept') S.accept = [...document.querySelectorAll('input[name="accept"]:checked')].map((el) => Number(el.value));
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'num') openNumber(e.target.value);
  if (e.key === 'Enter' && e.target.id === 'rwal') lookupRecord();
});

setInterval(() => {
  if (S.screen !== 'request' || !S.target || !S.cur) return;
  const left = S.target - nowSec(), el = $('#clock');
  if (left <= 0) { S.target = 0; if (!DEMO) loadRequest(S.cur.id, true); return; }
  if (el) el.textContent = clockTxt(left);
}, 1000);

if (window.ethereum && window.ethereum.on) window.ethereum.on('accountsChanged', () => { if (!DEMO) location.reload(); });

(async () => {
  setup();
  if (DEMO) {
    if (DEMO_AS === 'seller' || DEMO_AS === 'buyer') { account = DEMO_ME; $('#wallet').textContent = shortAddr(account); }
    const bar = document.createElement('div'); bar.className = 'demo'; bar.textContent = 'Demo screens with made-up data. Nothing is sent.'; document.body.prepend(bar);
  }
  /* old links like ?id=12 open request 12 */
  const qid = Q.get('id');
  if (qid && /^[1-9]\d*$/.test(qid)) {
    Q.delete('id'); const qs = Q.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + '#/request/' + qid);
  }
  paintNgnBtn();
  loadRate();
  setInterval(loadRate, 60000);
  let off = false; try { off = localStorage.getItem('amana_off') === '1'; } catch {}
  if (!DEMO && window.ethereum && !off) { try { const a = await window.ethereum.request({ method: 'eth_accounts' }); if (a.length) await connect(); } catch {} }
  route();
})();
</script>
</body>

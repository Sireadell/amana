<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amana</title>
<meta name="description" content="Amana lets a buyer promise payment by pledging Aave savings they already have, while the seller can claim only what is owed if the buyer misses the date. Live on Arc mainnet.">
<link rel="icon" href="data:,">
<style>
:root{--bg:#fafaf7;--ink:#1b1b18;--mute:#66665e;--line:#dedcd2;--card:#fff;--accent:#1f5f4a;--accent-ink:#fff;--tint:#e6f1ec;--warn:#9a4a00;--warn-tint:#f8ecdc;--bad:#9b1c1c;--bad-tint:#f7e3e3;--shadow:0 6px 24px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--ink:#ecebe4;--mute:#a2a197;--line:#33322c;--card:#1c1c19;--accent:#59b394;--accent-ink:#0d1b16;--tint:#1c2b25;--warn:#e0a35c;--warn-tint:#2e2418;--bad:#ef8b8b;--bad-tint:#2f1d1d;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
button,input{font:inherit;color:inherit}
.app{width:100%;max-width:420px;flex:1;min-height:0;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.app{margin:16px 0;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;max-height:780px}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 2px}
.brand{font-weight:800;letter-spacing:.02em;color:var(--accent);font-size:18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
main{flex:1;min-height:0;overflow:auto;padding:6px 16px 10px;display:flex;flex-direction:column}
h1{font-size:23px;line-height:1.2;margin:6px 0 6px}
.lead{color:var(--mute);margin:0 0 10px;font-size:14.5px;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.card h3{margin:0 0 6px;font-size:16px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px}
label:first-child{margin-top:0}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer}
.big:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.ghost{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:transparent;cursor:pointer;font-weight:600;font-size:15px}
.link{background:none;border:0;color:var(--accent);padding:4px 0;cursor:pointer;font-weight:600;text-decoration:underline;font-size:15px}
.hint{color:var(--mute);font-size:13.5px;margin:6px 0 0;line-height:1.4}
.spacer{flex:1;min-height:6px}
.msg{margin:6px 0 8px;font-size:14px;min-height:0}
.msg:empty{display:none}
.msg.err{color:var(--bad)}
.msg a{color:var(--accent)}
nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--card)}
nav button{background:none;border:0;padding:10px 8px 12px;cursor:pointer;color:var(--mute);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--accent)}
.back{background:none;border:0;color:var(--mute);cursor:pointer;padding:2px 0 6px;font-size:14px;text-align:left}
.track{display:flex;align-items:flex-start;margin:2px 0 10px}
.step{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--mute);font-weight:600}
.step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:13px;position:relative;z-index:1}
.step:not(:first-child)::before{content:"";position:absolute;top:12px;right:50%;width:100%;height:2px;background:var(--line)}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done,.step.now{color:var(--ink)}
.step.done::before,.step.now::before{background:var(--accent)}
.step.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.step.bad .dot{background:var(--warn);border-color:var(--warn);color:#fff}
.step.bad::before{background:var(--warn)}
.status{border-radius:16px;padding:14px;margin:0 0 10px;background:var(--tint)}
.status.warn{background:var(--warn-tint)}
.status.bad{background:var(--bad-tint)}
.status h2{margin:0 0 4px;font-size:19px;line-height:1.25}
.status p{margin:0;font-size:14.5px;line-height:1.4}
.clock{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 4px;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.stat b{display:block;font-size:16px;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--mute)}
.savings{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 10px;font-size:15px}
.savings h3{margin:0 0 4px;font-size:15px}
.savings p{margin:2px 0}
.savings .ok{color:var(--accent);font-weight:600}
.savings .no{color:var(--bad);font-weight:600}
details{margin:6px 0 0;font-size:14px}
summary{cursor:pointer;color:var(--mute);padding:4px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:13.5px}
dt{color:var(--mute)}dd{margin:0;word-break:break-all}
details p{margin:8px 0 0;color:var(--mute)}
.mylist{margin:2px 0 0;font-size:14px;color:var(--mute)}
.mylist button{margin:0 8px 0 0;font-size:14px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:16px 18px 18px;width:100%;max-height:92%;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:20px}
.sheet h3{margin:12px 0 2px;font-size:15px}
.sheet p{margin:6px 0;font-size:14.5px}
.sheet ol{padding-left:20px;margin:8px 0 8px}
.sheet li{margin:5px 0;font-size:14.5px}
.sheet a{color:var(--accent)}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;text-align:center;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <span class="brand">Amana</span>
    <button class="chip" id="wallet" type="button">Connect wallet</button>
  </header>

  <main id="main"></main>

  <nav id="nav" aria-label="Sections">
    <button type="button" data-tab="sell"><span class="ic">&#9783;</span>I'm selling</button>
    <button type="button" data-tab="buy"><span class="ic">&#9786;</span>I'm buying</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <div class="sheet-bg" id="sheetBg" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-label="Information"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script>
const CFG = {
  holdfast: '0x59769AbD5932BF60391e5D81A4DfFb16523eD24c',
  usdc: '0x3600000000000000000000000000000000000000',
  vault: '0x42EAB64310E1D1c66b4d8aF7C9C4ce253885eB83',
  rpc: 'https://rpc.mainnet.arc.io',
  chainId: 5042,
  explorer: 'https://explorer.arc.io',
  readme: 'https://github.com/Sireadell/amana'
};
const HF_ABI = [
  'function createRequest(uint256 amount,uint64 dueAt,address buyer) returns (uint256)',
  'function pledge(uint256 id,bytes32 termsHash,uint256 shares)',
  'function pay(uint256 id,uint256 amount)',
  'function claim(uint256 id)',
  'function release(uint256 id)',
  'function reclaim(uint256 id)',
  'function cancel(uint256 id)',
  'function withdrawCredit()',
  'function credited(address) view returns (uint256)',
  'function requestCount() view returns (uint256)',
  'function getRequest(uint256 id) view returns (tuple(address seller,address buyer,uint8 state,uint64 dueAt,uint256 amount,uint256 paid,uint256 shares,bytes32 termsHash))',
  'function claimOpensAt(uint256 id) view returns (uint256)',
  'function sharesNeededFor(uint256 amount) view returns (uint256)',
  'function termsHashOf(uint256 id) view returns (bytes32)',
  'event RequestCreated(uint256 indexed id,address indexed seller,address indexed buyer,uint256 amount,uint64 dueAt,bytes32 termsHash)'
];
const ERC_ABI = ['function approve(address,uint256) returns (bool)', 'function allowance(address,address) view returns (uint256)', 'function balanceOf(address) view returns (uint256)'];
const VAULT_ABI = [...ERC_ABI, 'function convertToAssets(uint256) view returns (uint256)', 'function maxRedeem(address) view returns (uint256)'];
const STATES = ['NONE', 'OPEN', 'PLEDGED', 'PAID', 'CLAIMED', 'RELEASED', 'RECLAIMED', 'CANCELLED'];
const GRACE = 3600, RECLAIM = 30 * 86400, MAX_TERM = 365 * 86400;

const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const S = { screen: 'home', tab: 'sell', cur: null, msg: null, mine: [], target: 0 };
let read, signer, account, hfR, vaultR;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function retry(fn, n = 5) { for (let i = 0; ; i++) { try { return await fn(); } catch (e) { if (i >= n - 1 || !/32014|timeout|fetch|network|503|502/i.test(String(e.message))) throw e; await sleep(800 * (i + 1)); } } }

const num = (n, min = 0, max = 4) => (Number(n) / 1e6).toLocaleString(undefined, { minimumFractionDigits: min, maximumFractionDigits: max });
const usd = (n) => num(n, 0, 6) + ' USDC';
const worthTxt = (n) => num(n, 2, 4) + ' USDC';
const shortAddr = (a) => a.slice(0, 6) + '...' + a.slice(-4);
const dateTxt = (t) => new Date(Number(t) * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const dateShort = (t) => new Date(Number(t) * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dateTime = (t) => new Date(Number(t) * 1000).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const nowSec = () => Math.floor(Date.now() / 1000);

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600); }
function setMsg(text, err, href, hrefText) {
  S.msg = text ? { text, err: !!err, href, hrefText } : null;
  paintMsg();
}
function paintMsg() {
  const el = $('#msg'); if (!el) return;
  el.textContent = ''; el.className = 'msg';
  if (!S.msg) return;
  if (S.msg.err) el.classList.add('err');
  el.append(S.msg.text);
  if (S.msg.href) { el.append(' '); const a = document.createElement('a'); a.href = S.msg.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = S.msg.hrefText; el.append(a); }
}
const msgEl = '<p class="msg" id="msg" role="status"></p>';

function setup() {
  read = new ethers.JsonRpcProvider(CFG.rpc, CFG.chainId, { staticNetwork: true });
  hfR = new ethers.Contract(CFG.holdfast, HF_ABI, read);
  vaultR = new ethers.Contract(CFG.vault, VAULT_ABI, read);
}

const NO_WALLET = 'You need a crypto wallet for this, such as MetaMask or Rabby. Install one in this browser, then reload the page.';
async function connect() {
  if (!window.ethereum) { setMsg(NO_WALLET, true); if (!$('#msg')) toast(NO_WALLET); return false; }
  try {
    const bp = new ethers.BrowserProvider(window.ethereum);
    await bp.send('eth_requestAccounts', []);
    const hex = '0x' + CFG.chainId.toString(16);
    try { await bp.send('wallet_switchEthereumChain', [{ chainId: hex }]); }
    catch (e) {
      await bp.send('wallet_addEthereumChain', [{ chainId: hex, chainName: 'Arc', nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 }, rpcUrls: [CFG.rpc], blockExplorerUrls: [CFG.explorer] }]);
    }
    const p2 = new ethers.BrowserProvider(window.ethereum);
    signer = await p2.getSigner();
    account = (await signer.getAddress()).toLowerCase();
    $('#wallet').textContent = shortAddr(account);
    return true;
  } catch (e) { setMsg('Could not connect your wallet: ' + friendly(e), true); return false; }
}
const ensure = async () => { if (!signer && !(await connect())) return false; return true; };

async function tx(label, fn) {
  setMsg(label + ': confirm in your wallet...');
  try {
    const t = await fn();
    setMsg(label + ': sent, waiting for Arc...');
    const rc = await t.wait();
    const text = label + ' done.';
    const id = S.cur.id;
    S.msg = { text, err: false, href: `${CFG.explorer}/tx/${rc.hash}`, hrefText: 'See it on the explorer' };
    await loadRequest(id, true);
    return true;
  } catch (e) { setMsg(label + ' failed: ' + friendly(e), true); return false; }
}

function friendly(e) {
  const m = String(e.shortMessage || e.reason || e.message || e);
  const map = { TooEarly: 'It is too early for that.', TooLate: 'The due date has passed.', NotCovered: 'The pledge is worth less than 105% of the amount.', NotCashable: 'The vault cannot pay out those shares right now.', NotSeller: 'Only the seller can do that.', NotBuyer: 'Only the buyer can do that.', BadState: 'This request is not in the right state for that.', WrongTerms: 'The terms changed or do not match.', TransferFailed: 'A transfer failed. Check your balance and approval.', BadAmount: 'That amount is not allowed.', BadDate: 'That due date is not allowed.' };
  for (const k in map) if (m.includes(k)) return map[k];
  if (/user rejected|denied/i.test(m)) return 'You cancelled it in your wallet.';
  return m.slice(0, 160);
}

/* ---------- pieces ---------- */
function track(state, late) {
  const final = { PAID: 'Paid', CLAIMED: 'Claimed', RELEASED: 'Released', RECLAIMED: 'Taken back', CANCELLED: 'Cancelled' }[state] || 'Paid or claimed';
  const cls = {
    OPEN: ['done', 'now', ''], PLEDGED: ['done', 'done', 'now'], PAID: ['done', 'done', 'done'],
    CLAIMED: ['done', 'done', 'bad'], RELEASED: ['done', 'done', 'done'], RECLAIMED: ['done', 'done', 'bad'], CANCELLED: ['done', 'bad', '']
  }[state];
  const names = ['Request made', 'Pledged', final];
  return '<div class="track" aria-label="Progress">' + names.map((n, i) =>
    `<div class="step ${cls[i]}"><div class="dot">${cls[i] === 'done' || cls[i] === 'bad' ? '&#10003;' : i + 1}</div>${n}</div>`).join('') + '</div>';
}
const stats = (o, p, d) => `<div class="stats"><div class="stat"><b>${o}</b><span>owed</span></div><div class="stat"><b>${p}</b><span>pledged</span></div><div class="stat"><b>${d}</b><span>due</span></div></div>`;
function clockTxt(sec) {
  sec = Math.max(0, sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}
function detailsHtml(c) {
  const r = c.r;
  return `<details><summary>Details</summary><dl>
    <dt>Request</dt><dd>#${c.id}</dd>
    <dt>Seller</dt><dd>${r.seller}</dd>
    <dt>Buyer</dt><dd>${r.buyer === ethers.ZeroAddress ? 'Anyone can pledge' : r.buyer}</dd>
    <dt>Due</dt><dd>${dateTxt(r.dueAt)}</dd>
    <dt>Claim opens</dt><dd>${dateTime(c.claimOpens)}, 1 hour after the due date</dd>
    <dt>Buyer can take it back</dt><dd>${dateTime(c.claimOpens + RECLAIM)}, 30 days after the claim opens</dd>
    <dt>Pledged shares</dt><dd>${r.shares > 0n ? num(r.shares, 0, 6) + ' waCoreUSDC' : 'None locked'}</dd>
    <dt>Contract</dt><dd>${CFG.holdfast} on Arc mainnet</dd>
    <dt>Share link</dt><dd>${shareLink(c.id)}</dd>
  </dl>
  <p><b>What Amana cannot check:</b> it cannot tell whether goods arrived. It only enforces the pledge and the date. <a href="${CFG.readme}" target="_blank" rel="noopener" style="color:var(--accent)">Read the limits</a>.</p></details>`;
}
const shareLink = (id) => location.origin + location.pathname + '?id=' + id;

/* ---------- screens ---------- */
function homeHtml() {
  if (S.tab === 'sell') {
    const mine = S.mine.length ? `<p class="mylist">Your requests: ${S.mine.map((m) => `<button class="link" data-open="${m.id}" type="button">#${m.id} ${m.label}</button>`).join('')}</p>` : '';
    return `
      <h1>Sell now, get paid or protected later.</h1>
      <p class="lead">Make a request for the amount owed and the date payment is due. The buyer backs their promise with Aave savings they already have.</p>
      <div class="card">
        <label for="amt">How much are you owed, in USDC?</label>
        <input id="amt" inputmode="decimal" placeholder="200" value="200">
        <div class="two">
          <div><label for="due">Pay me by</label><input id="due" type="date"></div>
          <div><label for="who">Buyer (optional)</label><input id="who" placeholder="0x..." autocomplete="off" spellcheck="false"></div>
        </div>
        <button class="big" id="create" type="button" style="margin-top:12px">Make request</button>
        <p class="hint" id="helper"></p>
      </div>
      ${msgEl}
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <button class="link" data-sheet="how" type="button">See how it works</button>
        <button class="link" data-sheet="why" type="button">Why this exists</button>
      </div>
      ${mine}
      <div class="spacer"></div>
      <form class="two" id="lookupS" style="grid-template-columns:1fr auto;align-items:end" onsubmit="return false">
        <div><label for="numS" style="margin:0 0 3px">Already have one? Request number</label><input id="numS" inputmode="numeric" placeholder="1"></div>
        <button class="ghost" id="openS" type="button" style="margin:0;width:auto;padding:10px 16px">Open</button>
      </form>`;
  }
  return `
    <h1>Use your Aave savings as your promise to pay.</h1>
    <p class="lead">Open the seller's request and pledge savings you already hold. Your shares keep earning, and they come back when you pay.</p>
    <div class="card">
      <label for="num">Request number from the seller</label>
      <input id="num" inputmode="numeric" placeholder="1">
      <button class="big" id="openReq" type="button" style="margin-top:12px">Open request</button>
      <p class="hint">The seller may send you a link that opens the request directly.</p>
    </div>
    ${msgEl}
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <button class="link" data-sheet="how" type="button">See how it works</button>
      <button class="link" data-sheet="why" type="button">Why this exists</button>
    </div>`;
}

function requestHtml(c) {
  const { r, state, now, owed, role } = c;
  const amt = usd(r.amount), pledgeWorth = c.neededWorth != null ? worthTxt(c.neededWorth) : '';
  const late = state === 'PLEDGED' && now >= Number(r.dueAt);
  const claimable = state === 'PLEDGED' && now >= c.claimOpens;
  const isS = role === 'seller', isB = role === 'buyer';
  let head, body, st = '', btns = '', sav = '', clock = '', statLine, cls = '';
  const dueS = dateShort(r.dueAt);
  S.target = 0;

  if (state === 'OPEN') {
    cls = 'warn';
    const passed = now >= Number(r.dueAt);
    statLine = stats(amt, 'Not yet', dueS);
    if (passed) { head = 'The due date has passed.'; body = 'Nobody pledged before the date, so this request can no longer be pledged.'; }
    else if (isS) { head = "Waiting for the buyer's pledge."; body = 'Send the request link to the buyer. Nothing is protected yet, and you can cancel before they pledge. The buyer must pledge at least 105% of the amount owed.'; }
    else if (isB) { head = 'Pledge your Aave savings to accept.'; body = `You owe ${amt}. To accept, pledge at least ${pledgeWorth} worth of your Aave USDC vault shares.`; }
    else if (role === 'other') { head = 'This request is for a different wallet.'; body = 'The seller named another buyer for this request, so only that wallet can pledge.'; }
    else { head = "Waiting for the buyer's pledge."; body = `The buyer must pledge at least ${pledgeWorth} worth of Aave USDC vault shares to cover ${amt}.`; }
    if (isB && !passed) {
      let line1 = `<p>Needed: <b>${pledgeWorth}</b> worth</p>`, line2, line3 = '';
      if (c.haveWorth == null) line2 = '<p>You have: not read yet</p>';
      else {
        line2 = `<p>You have: <b>${worthTxt(c.haveWorth)}</b> worth</p>`;
        line3 = c.enough ? '<p class="ok">You already have enough to cover this.</p>'
          : '<p class="no">You do not have enough yet.</p><p class="hint">First deposit USDC into the Aave USDC vault (waCoreUSDC), then come back.</p>';
      }
      sav = `<div class="savings"><h3>Your Aave savings</h3>${line1}${line2}${line3}</div>`;
    } else if (role === 'visitor' && !passed) {
      sav = `<div class="savings"><h3>Your Aave savings</h3><p>Needed: <b>${pledgeWorth}</b> worth</p><p class="hint">Connect your wallet to see whether you already have enough.</p></div>`;
    }
    if (passed) btns = isS ? '<button class="big" data-act="cancel" type="button">Cancel this request</button>' : '<button class="big" data-home type="button">Back home</button>';
    else if (isS) btns = '<button class="big" data-act="send" type="button">Send link</button><button class="ghost" data-act="cancel" type="button">Cancel this request</button>';
    else if (isB) btns = '<button class="big" data-act="pledge" type="button">Pledge Aave savings</button>';
    else if (role === 'other') btns = '<button class="big" data-home type="button">Back home</button>';
    else btns = '<button class="big" data-act="connect" type="button">Connect wallet to pledge</button>';
  } else if (state === 'PLEDGED') {
    const pw = c.worth != null ? worthTxt(c.worth) : '';
    statLine = stats(usd(owed), pw ? num(c.worth, 0, 2) + ' USDC' : '...', dueS);
    cls = claimable ? 'bad' : '';
    if (!late) {
      S.target = isS ? c.claimOpens : Number(r.dueAt);
      head = isS ? "The buyer's pledge is in place." : 'Your promise is backed by your Aave savings.';
      clock = `<p>${isS ? 'You can claim in' : 'You have time. Due date in'}</p><div class="clock" id="clock">${clockTxt(S.target - now)}</div>`;
      body = isS ? `The buyer pledged ${pw} worth of Aave savings. You cannot claim early. If they pay another way, release the pledge.`
        : isB ? `Your ${pw} worth of shares is held by Amana and keeps earning. Pay ${usd(owed)} before the seller claims to get every share back.`
        : `The buyer pledged ${pw} worth of Aave savings. It is held by Amana and keeps earning for them.`;
    } else if (!claimable) {
      S.target = c.claimOpens;
      head = 'The due date has passed.';
      clock = `<p>${isS ? 'You can claim in' : 'The seller can claim in'}</p><div class="clock" id="clock">${clockTxt(S.target - now)}</div>`;
      body = isB ? 'You can still pay before the seller claims.' : 'The claim opens one hour after the due date.';
    } else {
      head = isS ? 'The due date has passed.' : 'The request is overdue.';
      body = isS ? 'You can now claim only what you are owed. The buyer gets the rest back in the same step.'
        : `You can still pay before the seller claims. If they claim first, they take shares worth ${usd(owed)} and you get the rest back.`;
    }
    if (isS) {
      btns = claimable ? '<button class="big" data-act="claim" type="button">Claim what I am owed</button>'
        : `<button class="big" type="button" disabled>Claim opens ${dateShort(c.claimOpens)}, 1 hour after the due date</button>`;
      btns += '<button class="ghost" data-act="release" type="button">I was paid, release the pledge</button>';
    } else if (isB) {
      btns = `<button class="big" data-act="pay" type="button">${late ? 'Pay now' : 'Pay ' + usd(owed)}</button>`;
      if (now >= c.claimOpens + RECLAIM) btns = '<button class="big" data-act="reclaim" type="button">Take my pledge back</button>' + `<button class="ghost" data-act="pay" type="button">Pay ${usd(owed)} instead</button>`;
    } else if (role === 'other') btns = '<button class="big" data-home type="button">Back home</button>';
    else btns = '<button class="big" data-act="connect" type="button">Connect wallet</button>';
    if (role === 'visitor') body += ' Connect the seller\'s or buyer\'s wallet to act on this request.';
  } else {
    const T = {
      PAID: ['Paid in full.', '', `The seller received ${usd(r.amount)}. The buyer got every pledged share back, including any yield earned while pledged.`, ['0 USDC', 'Returned', dueS]],
      CLAIMED: ['Seller claimed what was owed.', 'bad', `The seller received shares worth ${usd(r.amount - r.paid)}. The remaining shares went back to the buyer in the same step. The seller can cash out the claimed shares in Aave.`, [usd(r.amount - r.paid), 'Claimed', dueS]],
      RELEASED: ['Pledge released.', '', 'The seller released the request, so all pledged shares went back to the buyer.', ['Settled', 'Returned', dueS]],
      RECLAIMED: ['The buyer took the pledge back.', 'warn', 'The seller did nothing for 30 days after the claim opened, so the buyer took all the pledged shares back.', ['Settled', 'Returned', dueS]],
      CANCELLED: ['Request cancelled.', 'warn', 'The seller cancelled before anyone pledged. Nothing was locked.', ['Cancelled', 'None', dueS]]
    }[state];
    [head, cls, body] = T; statLine = stats(...T[3]);
    btns = '<button class="big" data-home type="button">Back home</button>';
    if (isS && c.credit > 0n) btns += `<button class="ghost" data-act="withdraw" type="button">Collect ${usd(c.credit)} held for me</button>`;
  }
  if (isS && c.credit > 0n && state !== 'PAID' && !btns.includes('withdraw')) btns += `<button class="ghost" data-act="withdraw" type="button">Collect ${usd(c.credit)} held for me</button>`;

  return `<button class="back" data-home type="button">&larr; Back home</button>
    ${track(state)}
    <div class="status ${cls}"><h2>${head}</h2>${clock}<p>${body}</p></div>
    ${statLine}
    ${sav}
    <div class="spacer"></div>
    ${msgEl}
    ${btns}
    ${detailsHtml(c)}`;
}

function sheetHtml(kind) {
  if (kind === 'why') return `<h2>Why this exists</h2>
    <p>I have a shop. Some of my customers keep their money in Aave, earning yield, and they don't want to unlock it just to buy something from me. But I can't trust that they will bring the money later on their own.</p>
    <p>So the customer pledges 105% of what they owe me, using the savings they already have in Aave. They don't cash anything out, so the money keeps earning. We lock it until a due date, and the customer picks the date or we choose it together.</p>
    <p>If they pay before that date, they get everything back, and they kept earning the whole time. If they don't, I can claim only what I am owed, and the rest goes straight back to them.</p>
    <button class="big" data-sheet-close type="button" style="margin-top:12px">Got it</button>`;
  return `<h2>How it works, with 200 USDC due in 30 days</h2>
    <ol>
      <li>You make a request for 200 USDC due in 30 days and send the buyer the link.</li>
      <li>The buyer pledges 210 USDC worth of Aave vault shares. Those shares keep earning interest for them.</li>
      <li>If the buyer pays, you get 200 USDC and they get every share back.</li>
      <li>If the buyer does not pay, you can claim one hour after the due date. You take only the shares worth 200 USDC, and the rest goes back to the buyer in the same step.</li>
    </ol>
    <p>A smart contract holds the pledge. It has no owner, no fees, and nobody can change its rules. If you do not claim, the buyer can take the pledge back 30 days after your claim opens.</p>
    <h3>What Amana cannot check</h3>
    <p>It cannot tell whether goods arrived. It only enforces the pledge and the date.</p>
    <h3>Limits, honestly</h3>
    <p>Aave can halt its vault, the vault holds only a few thousand USDC, and the seller is paid in vault shares that they cash out. Use small amounts. Details are in the <a href="${CFG.readme}" target="_blank" rel="noopener">README</a>.</p>
    <button class="big" data-sheet-close type="button" style="margin-top:12px">Got it</button>`;
}

/* ---------- render ---------- */
function render() {
  const home = S.screen === 'home';
  main.innerHTML = home ? homeHtml() : (S.cur && S.cur.html) || '';
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', home && b.dataset.tab === S.tab));
  if (home && S.tab === 'sell') {
    const t = new Date(Date.now() + 30 * 86400000); const due = $('#due');
    due.value = S.dueVal || (t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'));
    due.min = new Date().toISOString().slice(0, 10);
    updateHelper();
  }
  paintMsg();
  main.scrollTop = 0;
}
function updateHelper() {
  const h = $('#helper'); if (!h) return;
  const v = ($('#amt').value || '').trim();
  const n = /^\d+(\.\d{1,6})?$/.test(v) ? Number(v) : null;
  h.textContent = n === null ? 'The buyer must pledge at least 105% of the amount owed, in Aave USDC vault shares.'
    : `For ${v} USDC due, the buyer must pledge at least ${(Math.ceil(n * 105) / 100).toLocaleString(undefined, { maximumFractionDigits: 2 })} USDC worth of Aave USDC vault shares.`;
}
function goHome(tab) {
  if (tab) S.tab = tab;
  S.screen = 'home'; S.cur = null; S.msg = null; S.target = 0;
  history.replaceState(null, '', location.pathname);
  render(); loadMine();
}

async function loadRequest(id, keepMsg) {
  if (!keepMsg) S.msg = null;
  S.screen = 'request';
  let r;
  try { r = await retry(() => hfR.getRequest(id)); }
  catch (e) { S.cur = { id, html: '<button class="back" data-home type="button">&larr; Back home</button><div class="status bad"><h2>Could not read Arc right now.</h2><p>Reload in a moment.</p></div>' }; render(); return; }
  if (Number(r.state) === 0) { S.cur = { id, html: `<button class="back" data-home type="button">&larr; Back home</button><div class="status bad"><h2>No such request.</h2><p>There is no request number ${id}. Check the number with the seller.</p></div>` }; render(); return; }
  const state = STATES[Number(r.state)], now = nowSec();
  const claimOpens = Number(r.dueAt) + GRACE, owed = r.amount - r.paid;
  const isSeller = !!account && r.seller.toLowerCase() === account;
  const isBuyer = !!account && (r.buyer.toLowerCase() === account || (state === 'OPEN' && r.buyer === ethers.ZeroAddress && !isSeller));
  const role = isSeller ? 'seller' : isBuyer ? 'buyer' : (account ? 'other' : 'visitor');
  const c = { id, r, state, now, claimOpens, owed, role, credit: 0n, worth: null, neededWorth: null, haveWorth: null, enough: false };
  try {
    const needed = await retry(() => hfR.sharesNeededFor(r.amount));
    c.needed = needed;
    c.neededWorth = await retry(() => vaultR.convertToAssets(needed));
    if (r.shares > 0n) c.worth = await retry(() => vaultR.convertToAssets(r.shares));
    if (isBuyer && state === 'OPEN') {
      const have = await retry(() => vaultR.balanceOf(account));
      c.haveShares = have;
      c.haveWorth = have > 0n ? await retry(() => vaultR.convertToAssets(have)) : 0n;
      c.enough = have >= needed;
    }
    if (isSeller) c.credit = await retry(() => hfR.credited(account));
  } catch (e) { /* show what we have; actions re-check on click */ }
  if (c.neededWorth == null) c.neededWorth = (r.amount * 105n) / 100n;
  c.html = requestHtml(c);
  S.cur = c;
  history.replaceState(null, '', '?id=' + id);
  render();
}

async function loadMine() {
  if (!account) return;
  try {
    const n = Number(await retry(() => hfR.requestCount()));
    const ids = []; for (let i = n; i >= 1 && ids.length < 12; i--) ids.push(i);
    const rs = await Promise.all(ids.map((i) => retry(() => hfR.getRequest(i)).then((r) => [i, r])));
    S.mine = rs.filter(([, r]) => r.seller.toLowerCase() === account || r.buyer.toLowerCase() === account)
      .slice(0, 5).map(([i, r]) => ({ id: i, label: (r.seller.toLowerCase() === account ? 'selling' : 'buying') + ', ' + STATES[Number(r.state)].toLowerCase() }));
    if (S.screen === 'home' && S.tab === 'sell') { const keepA = $('#amt') && $('#amt').value, keepD = $('#due') && $('#due').value, keepW = $('#who') && $('#who').value; render(); if (keepA) $('#amt').value = keepA; if (keepD) $('#due').value = keepD; if (keepW) $('#who').value = keepW; updateHelper(); }
  } catch (e) { /* the list is optional */ }
}

/* ---------- actions ---------- */
async function createReq() {
  setMsg('');
  const amt = $('#amt').value.trim(), due = $('#due').value, buyer = $('#who').value.trim();
  if (!/^\d+(\.\d{1,6})?$/.test(amt) || Number(amt) < 1) return setMsg('Enter an amount of at least 1 USDC.', true);
  if (!due) return setMsg('Pick the date you want to be paid by.', true);
  if (buyer && !ethers.isAddress(buyer)) return setMsg('That buyer address is not valid.', true);
  const dueAt = Math.floor(new Date(due + 'T23:59:00').getTime() / 1000);
  if (dueAt <= nowSec()) return setMsg('Pick a date in the future.', true);
  if (dueAt > nowSec() + MAX_TERM - 3600) return setMsg('The date can be at most one year away.', true);
  if (!(await connect())) return;
  try {
    setMsg('Confirm in your wallet...');
    const hf = new ethers.Contract(CFG.holdfast, HF_ABI, signer);
    const t = await hf.createRequest(ethers.parseUnits(amt, 6), dueAt, buyer || ethers.ZeroAddress);
    setMsg('Sent, waiting for Arc...');
    const rc = await t.wait();
    let id;
    for (const l of rc.logs) { try { const p = hf.interface.parseLog(l); if (p && p.name === 'RequestCreated') id = p.args.id; } catch {} }
    if (id === undefined) id = await hf.requestCount();
    location.href = '?id=' + id.toString();
  } catch (e) { setMsg('Failed: ' + friendly(e), true); }
}

const hfW = () => new ethers.Contract(CFG.holdfast, HF_ABI, signer);
async function act(name) {
  const c = S.cur; if (!c) return;
  if (name === 'send') {
    const link = shareLink(c.id);
    try { await navigator.clipboard.writeText(link); toast('Link copied. Send it to the buyer.'); }
    catch { setMsg('Send the buyer this link: ' + link); }
    window.open('https://wa.me/?text=' + encodeURIComponent('Amana request to pledge: ' + link), '_blank', 'noopener');
    return;
  }
  if (name === 'connect') { if (await connect()) loadRequest(c.id); return; }
  if (!(await ensure())) return;
  if (name === 'pledge') {
    let need, have, maxR;
    try {
      need = await retry(() => hfR.sharesNeededFor(c.r.amount));
      have = await retry(() => vaultR.balanceOf(account));
      maxR = await retry(() => vaultR.maxRedeem(account));
    } catch (e) { return setMsg('Could not read your balance: ' + friendly(e), true); }
    if (have < need) return setMsg(`You need ${num(need, 0, 6)} Aave USDC vault shares (waCoreUSDC) in this wallet. You have ${num(have, 0, 6)}. Deposit USDC into the Aave vault first.`, true);
    if (maxR < need) return setMsg('The vault cannot pay out that many shares right now, so it cannot be pledged.', true);
    const v = new ethers.Contract(CFG.vault, VAULT_ABI, signer);
    if (!(await tx('Approve the exact shares', () => v.approve(CFG.holdfast, need)))) return;
    await tx('Pledge', () => hfW().pledge(c.id, c.r.termsHash, need));
  } else if (name === 'pay') {
    const u = new ethers.Contract(CFG.usdc, ERC_ABI, signer);
    try { const bal = await retry(() => u.balanceOf(account)); if (bal < c.owed) return setMsg(`You need ${usd(c.owed)} in this wallet to pay. You have ${usd(bal)}.`, true); } catch {}
    if (!(await tx('Approve the USDC', () => u.approve(CFG.holdfast, c.owed)))) return;
    await tx('Pay', () => hfW().pay(c.id, c.owed));
  } else if (name === 'claim') await tx('Claim', () => hfW().claim(c.id));
  else if (name === 'release') await tx('Release', () => hfW().release(c.id));
  else if (name === 'cancel') await tx('Cancel', () => hfW().cancel(c.id));
  else if (name === 'reclaim') await tx('Take back', () => hfW().reclaim(c.id));
  else if (name === 'withdraw') await tx('Collect', () => hfW().withdrawCredit());
}

function openNumber(v) {
  v = (v || '').trim();
  if (!/^\d+$/.test(v) || v === '0') { setMsg('Enter a request number, like 1.', true); return; }
  loadRequest(v);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'wallet') { connect().then((ok) => { if (ok) { if (S.cur) loadRequest(S.cur.id, true); else loadMine(); } }); return; }
  if (t.dataset.tab) { goHome(t.dataset.tab); return; }
  if (t.hasAttribute('data-home')) { goHome(); return; }
  if (t.dataset.sheet) { $('#sheet').innerHTML = sheetHtml(t.dataset.sheet); $('#sheetBg').hidden = false; return; }
  if (t.hasAttribute('data-sheet-close')) { $('#sheetBg').hidden = true; return; }
  if (t.dataset.open) { loadRequest(t.dataset.open); return; }
  if (t.dataset.act) { act(t.dataset.act); return; }
  if (t.id === 'create') { createReq(); return; }
  if (t.id === 'openReq') { openNumber($('#num').value); return; }
  if (t.id === 'openS') { openNumber($('#numS').value); return; }
});
document.addEventListener('input', (e) => { if (e.target.id === 'amt') updateHelper(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.id === 'num' || e.target.id === 'numS')) openNumber(e.target.value); });
$('#sheetBg').addEventListener('click', (e) => { if (e.target.id === 'sheetBg') e.target.hidden = true; });

setInterval(() => {
  if (S.screen !== 'request' || !S.target) return;
  const left = S.target - nowSec(), el = $('#clock');
  if (left <= 0 && S.cur) { S.target = 0; loadRequest(S.cur.id, true); return; }
  if (el) el.textContent = clockTxt(left);
}, 1000);

if (window.ethereum && window.ethereum.on) window.ethereum.on('accountsChanged', () => location.reload());

(async () => {
  setup();
  render();
  const id = new URLSearchParams(location.search).get('id');
  if (window.ethereum) { try { const a = await window.ethereum.request({ method: 'eth_accounts' }); if (a.length) await connect(); } catch {} }
  if (id && /^\d+$/.test(id) && id !== '0') await loadRequest(id);
  else loadMine();
})();
</script>
</body>
</html>
